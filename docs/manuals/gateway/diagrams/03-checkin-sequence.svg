<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="900" viewBox="0 0 2000 900"><rect width="2000" height="900" fill="#fff"/>
  <text x="40" y="52" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2A33">Registration, configuration and device assignment</text>
  <text x="40" y="82" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">All connections are outbound from the gateway and the Leaf, so both work behind NAT. Canopy never calls the gateway.</text>
  <rect x="90" y="110" width="340" height="56" rx="12" fill="#0F6E74"/><text x="260" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">Gateway (gateway-service)</text><line x1="260" y1="166" x2="260" y2="860" stroke="#0F6E74" stroke-width="2" stroke-dasharray="6 6"/><rect x="590" y="110" width="340" height="56" rx="12" fill="#B9802A"/><text x="760" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">Haber (Canopy)</text><line x1="760" y1="166" x2="760" y2="860" stroke="#B9802A" stroke-width="2" stroke-dasharray="6 6"/><rect x="1090" y="110" width="340" height="56" rx="12" fill="#B5525C"/><text x="1260" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">Canopy sync API</text><line x1="1260" y1="166" x2="1260" y2="860" stroke="#B5525C" stroke-width="2" stroke-dasharray="6 6"/><rect x="1570" y="110" width="340" height="56" rx="12" fill="#3D5A80"/><text x="1740" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">Leaf</text><line x1="1740" y1="166" x2="1740" y2="860" stroke="#3D5A80" stroke-width="2" stroke-dasharray="6 6"/><defs><marker id="am7ru38" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#1B2A33"/></marker></defs><path d="M260 230 L756 230" fill="none" stroke="#1B2A33" stroke-width="2.4"  marker-end="url(#am7ru38)"/><text x="510" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B2A33">POST /api/haber/v1/gateways/{id}/checkin</text><text x="510" y="254" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4A5A66">every 20 s · Bearer token · devices, site, applied_config_version, data_api_url</text><defs><marker id="aegbfy8" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#1B2A33"/></marker></defs><path d="M760 320 L1256 320" fill="none" stroke="#1B2A33" stroke-width="2.4"  marker-end="url(#aegbfy8)"/><text x="1010" y="308" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B2A33">POST /api/sync/v1/gateways/{id}/config</text><text x="1010" y="344" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4A5A66">upsert canopy_gateway + devices, snapshot on change</text><defs><marker id="ac3c8vv" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#1B2A33"/></marker></defs><path d="M1260 410 L764 410" fill="none" stroke="#1B2A33" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#ac3c8vv)"/><text x="1010" y="398" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B2A33">desired_config + version (if newer)</text><defs><marker id="azthzux" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#1B2A33"/></marker></defs><path d="M760 500 L264 500" fill="none" stroke="#1B2A33" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#azthzux)"/><text x="510" y="488" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B2A33">license, device_types, images, canopy_config</text><text x="510" y="524" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4A5A66">gateway applies config, starts / stops parsers</text><defs><marker id="akoriab" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#1B2A33"/></marker></defs><path d="M1740 600 L1264 600" fill="none" stroke="#1B2A33" stroke-width="2.4"  marker-end="url(#akoriab)"/><text x="1500" y="588" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B2A33">POST /api/sync/v1/gateways/{id}/assign</text><text x="1500" y="624" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4A5A66">Leaf wizard step 3: devices → this Leaf (queued as desired config)</text><defs><marker id="ay14nbw" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#1B2A33"/></marker></defs><path d="M260 690 L756 690" fill="none" stroke="#1B2A33" stroke-width="2.4"  marker-end="url(#ay14nbw)"/><text x="510" y="678" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B2A33">next check-in picks up the assignment</text><text x="510" y="714" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4A5A66">leaf_id set on gateway_device_instance</text><defs><marker id="ayi2fhb" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#1B2A33"/></marker></defs><path d="M1740 790 L264 790" fill="none" stroke="#1B2A33" stroke-width="2.4"  marker-end="url(#ayi2fhb)"/><text x="1000" y="778" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B2A33">GET /data-api/&lt;leaf&gt;/api/observations</text><text x="1000" y="814" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4A5A66">Leaf pulls directly from the gateway (works without Canopy)</text></svg>