<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="860" viewBox="0 0 2000 860"><rect width="2000" height="860" fill="#fff"/>
  <text x="40" y="52" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2A33">Kafka topics and message schemas</text>
  <text x="40" y="82" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">Message contracts in rust/crates/gateway-core/src/envelope.rs (mirrored in Python device_medical_service/envelope.py).</text>
