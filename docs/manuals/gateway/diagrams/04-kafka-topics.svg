erif" font-size="13" fill="#7A8A94">object</text><text x="446" y="334" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">issued_at</text><text x="776" y="334" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">ms</text><rect x="823" y="124" width="360" height="368" rx="14" fill="#000" opacity="0.05"/><rect x="820" y="120" width="360" height="368" rx="14" fill="#fff" stroke="#C9D5D8" stroke-width="1.6"/><path d="M820 134 a14 14 0 0 1 14 -14 h332 a14 14 0 0 1 14 14 v32 h-360 z" fill="#1B2A33"/><text x="836" y="151" font-family="Menlo, monospace" font-size="18" font-weight="700" fill="#fff">gw.obs  (key = device_id)</text><text x="836" y="192" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#0F6E74" font-weight="700">Producer: parsers</text><text x="836" y="211" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A5A66">Consumers: collector, publisher</text><text x="836" y="238" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">device_id</text><text x="1166" y="238" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">string</text><text x="836" y="262" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">source</text><text x="1166" y="262" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">string</text><text x="836" y="286" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">protocol</text><text x="1166" y="286" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">string</text><text x="836" y="310" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">raw_code</text><text x="1166" y="310" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">string</text><text x="836" y="334" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">ivy_param</text><text x="1166" y="334" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">Flora key</text><text x="836" y="358" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">value</text><text x="1166" y="358" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">any JSON</text><text x="836" y="382" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">unit</text><text x="1166" y="382" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">string</text><text x="836" y="406" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">device_ts</text><text x="1166" y="406" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">ms | null</text><text x="836" y="430" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">system_ts</text><text x="1166" y="430" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">ms</text><text x="836" y="454" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">pod</text><text x="1166" y="454" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">string</text><rect x="1213" y="124" width="380" height="368" rx="14" fill="#000" opacity="0.05"/><rect x="1210" y="120" width="380" height="368" rx="14" fill="#fff" stroke="#C9D5D8" stroke-width="1.6"/><path d="M1210 134 a14 14 0 0 1 14 -14 h352 a14 14 0 0 1 14 14 v32 h-380 z" fill="#1B2A33"/><text x="1226" y="151" font-family="Menlo, monospace" font-size="18" font-weight="700" fill="#fff">gw.measurements</text><text x="1226" y="192" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#0F6E74" font-weight="700">Producer: parsers (original fields)</text><text x="1226" y="211" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A5A66">Consumer: collector → gateway_measurement</text><text x="1226" y="238" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">device_id</text><text x="1576" y="238" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">string</text><text x="1226" y="262" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">protocol</text><text x="1576" y="262" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">string</text><text x="1226" y="286" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">pod</text><text x="1576" y="286" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">string</text><text x="1226" y="310" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">raw_code</text><text x="1576" y="310" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">string</text><text x="1226" y="334" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">raw_value</text><text x="1576" y="334" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">JSON</text><text x="1226" y="358" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">value</text><text x="1576" y="358" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">JSON</text><text x="1226" y="382" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">definition</text><text x="1576" y="382" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">JSON</text><text x="1226" y="406" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">mapping</text><text x="1576" y="406" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">JSON</text><text x="1226" y="430" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">system_ts / device_ts</text><text x="1576" y="430" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">ms</text><text x="1226" y="454" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">gateway_id, seq</text><text x="1576" y="454" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">string, u64</text><rect x="1623" y="124" width="340" height="272" rx="14" fill="#000" opacity="0.05"/><rect x="1620" y="120" width="340" height="272" rx="14" fill="#fff" stroke="#C9D5D8" stroke-width="1.6"/><path d="M1620 134 a14 14 0 0 1 14 -14 h312 a14 14 0 0 1 14 14 v32 h-340 z" fill="#1B2A33"/><text x="1636" y="151" font-family="Menlo, monospace" font-size="18" font-weight="700" fill="#fff">gw.logs</text><text x="1636" y="192" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#0F6E74" font-weight="700">Producer: all components</text><text x="1636" y="211" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A5A66">Consumer: collector → gateway_log</text><text x="1636" y="238" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">ts</text><text x="1946" y="238" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">ms</text><text x="1636" y="262" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">component</text><text x="1946" y="262" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">string</text><text x="1636" y="286" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">level</text><text x="1946" y="286" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">string</text><text x="1636" y="310" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">pod</text><text x="1946" y="310" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">string?</text><text x="1636" y="334" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">message</text><text x="1946" y="334" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">string</text><text x="1636" y="358" font-family="Menlo, monospace" font-size="14" fill="#1B2A33">detail</text><text x="1946" y="358" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A8A94">object</text><rect x="40" y="560" width="1920" height="240" rx="16" fill="#F4F7F8" stroke="#C9D5D8"/><circle cx="70" cy="612" r="6" fill="#0F6E74"/><text x="90" y="618" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1B2A33">Topics are auto-created, 1 partition, 72-hour retention. Names are sanitised to [A-Za-z0-9._-]. A pod is &lt;controller&gt;.&lt;id&gt;, e.g. socket.or-monitor or serial.COM1.</text><circle cx="70" cy="660" r="6" fill="#0F6E74"/><text x="90" y="666" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1B2A33">Consumer groups: gw-collector reads from the earliest offset and commits only after rows are stored; gw-parser-&lt;device_id&gt; reads from the latest offset (no replay after a restart).</text><circle cx="70" cy="708" r="6" fill="#0F6E74"/><text x="90" y="714" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1B2A33">Observation.ivy_param is the Flora parameter key (hr, spo2, nibp_sys, et_co2 …). The Leaf maps aliases and MDC codes to chart rows (device_writer.PARAMETERS).</text><circle cx="70" cy="756" r="6" fill="#0F6E74"/><text x="90" y="762" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1B2A33">The collector also upserts gateway_device_seen (last sample per device) used by /api/devices/status for online / waiting / offline.</text></svg>