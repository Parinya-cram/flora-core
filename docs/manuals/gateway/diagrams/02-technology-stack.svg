sans-serif" font-size="17" fill="#4A5A66">controllers, collector, server, publisher</text><rect x="875" y="330" width="530" height="180" rx="16" fill="#D7ECEC" stroke="#0F6E74" stroke-width="1.4"/><text x="897" y="390" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A33">Python 3.13 · FastAPI 0.118 · uvicorn</text><text x="897" y="428" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">gateway-service control plane, docker SDK</text><text x="897" y="454" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">7.1, httpx, aiokafka</text><rect x="1430" y="330" width="530" height="180" rx="16" fill="#D7ECEC" stroke="#0F6E74" stroke-width="1.4"/><text x="1452" y="390" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A33">Python 3.13 · aiokafka 0.12</text><text x="1452" y="428" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">device-medical-service parsers (HL7, MEDIBUS,</text><text x="1452" y="454" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">GE, BCC, M540 …)</text><rect x="40" y="540" width="250" height="180" rx="16" fill="#1B2A33"/><text x="165" y="638" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Messaging &amp; data</text><rect x="320" y="540" width="530" height="180" rx="16" fill="#E3E8EB" stroke="#1B2A33" stroke-width="1.4"/><text x="342" y="600" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A33">Apache Kafka 3.9.1</text><text x="342" y="638" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">KRaft single node, rdkafka 0.37 / aiokafka</text><rect x="875" y="540" width="530" height="180" rx="16" fill="#E3E8EB" stroke="#1B2A33" stroke-width="1.4"/><text x="897" y="600" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A33">PostgreSQL 17.6</text><text x="897" y="638" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">tokio-postgres + deadpool; psycopg 3.2 pool</text><rect x="1430" y="540" width="530" height="180" rx="16" fill="#E3E8EB" stroke="#1B2A33" stroke-width="1.4"/><text x="1452" y="600" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A33">Files</text><text x="1452" y="638" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">config/*.toml pods, instances*.json seed</text><rect x="40" y="750" width="250" height="180" rx="16" fill="#8A5A12"/><text x="165" y="848" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Platform &amp; delivery</text><rect x="320" y="750" width="530" height="180" rx="16" fill="#FBEBD0" stroke="#8A5A12" stroke-width="1.4"/><text x="342" y="810" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A33">Docker / Compose</text><text x="342" y="848" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">one container per device parser,</text><text x="342" y="874" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">unless-stopped</text><rect x="875" y="750" width="530" height="180" rx="16" fill="#FBEBD0" stroke="#8A5A12" stroke-width="1.4"/><text x="897" y="810" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A33">flora-updater</text><text x="897" y="848" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">docker:28-cli, Ed25519-signed releases from</text><text x="897" y="874" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">Root via Haber</text><rect x="1430" y="750" width="530" height="180" rx="16" fill="#FBEBD0" stroke="#8A5A12" stroke-width="1.4"/><text x="1452" y="810" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A33">Hardware I/O</text><text x="1452" y="848" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">tokio-serial 5.4 (RS-232), socat PTY bridges,</text><text x="1452" y="874" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">UDP multicast relay</text></svg>