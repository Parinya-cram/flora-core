<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="960" viewBox="0 0 2000 960"><rect width="2000" height="960" fill="#fff"/>
  <text x="40" y="52" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2A33">Flora Gateway architecture and data flow</text>
  <text x="40" y="82" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A66">Devices → ingress → Kafka → per-device parser → collector → PostgreSQL → read API → Leaf. Numbers follow the data path.</text>
  <rect x="300" y="120" width="1300" height="800" rx="22" fill="#F1F7F7" stroke="#0F6E74" stroke-width="2" stroke-dasharray="8 6"/><text x="324" y="154" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F6E74">Flora Gateway (one per OR / ICU network, Docker Compose project "flora-gateway")</text><rect x="33" y="204" width="230" height="520" rx="14" fill="#000" opacity="0.05"/><rect x="30" y="200" width="230" height="520" rx="14" fill="#FBEBD0" stroke="#E8A33D" stroke-width="1.6"/><text x="46" y="230" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A33">Medical devices</text><text x="46" y="256" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Patient monitors</text><text x="46" y="277" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">(HL7 v2, Dräger M540,</text><text x="46" y="298" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66"> Vista CMS, GE DRI)</text><text x="46" y="319" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66"></text><text x="46" y="340" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Anesthesia machines</text><text x="46" y="361" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">(GE COM 1.2, JSON)</text><text x="46" y="382" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66"></text><text x="46" y="403" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Ventilators</text><text x="46" y="424" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">(MEDIBUS.X, HTTP JSON)</text><text x="46" y="445" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66"></text><text x="46" y="466" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Infusion pumps</text><text x="46" y="487" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">(B. Braun BCC)</text><text x="46" y="508" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66"></text><text x="46" y="529" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Temperature modules</text><text x="46" y="550" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">(ASCII serial)</text><rect x="343" y="194" width="330" height="330" rx="14" fill="#000" opacity="0.05"/><rect x="340" y="190" width="330" height="330" rx="14" fill="#fff" stroke="#0F6E74" stroke-width="1.6"/><text x="356" y="220" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A33">Ingress controllers (Rust)</text><text x="356" y="246" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">serial-controller  RS-232</text><text x="356" y="267" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">socket-controller  TCP/UDP, MLLP,</text><text x="356" y="288" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">   HL7 ACK, Vista :9500</text><text x="356" y="309" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">webhook-controller  HTTP POST</text><text x="356" y="330" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">feeder-controller  HTTP polling</text><text x="356" y="351" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66"></text><text x="356" y="372" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Admin ports 7401–7404</text><text x="356" y="393" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Publish RawFrame</text><rect x="343" y="564" width="330" height="150" rx="14" fill="#000" opacity="0.05"/><rect x="340" y="560" width="330" height="150" rx="14" fill="#fff" stroke="#0F6E74" stroke-width="1.6"/><text x="356" y="590" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A33">gateway-service (Python)</text><text x="356" y="616" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Station admin UI  :7400</text><text x="356" y="637" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Device registry, license,</text><text x="356" y="658" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Canopy check-in, alerts</text><rect x="738" y="194" width="300" height="330" rx="14" fill="#000" opacity="0.05"/><rect x="735" y="190" width="300" height="330" rx="14" fill="#FFFFFF" stroke="#1B2A33" stroke-width="2"/><text x="751" y="220" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A33">Apache Kafka 3.9 (KRaft)</text><text x="751" y="246" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">gw.raw.&lt;pod&gt;</text><text x="751" y="267" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">gw.cmd.&lt;pod&gt;   (polls, ACKs)</text><text x="751" y="288" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">gw.obs</text><text x="751" y="309" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">gw.measurements</text><text x="751" y="330" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">gw.logs</text><text x="751" y="351" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66"></text><text x="751" y="372" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Retention 72 h</text><text x="751" y="393" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Host port 7414</text><rect x="738" y="564" width="300" height="150" rx="14" fill="#000" opacity="0.05"/><rect x="735" y="560" width="300" height="150" rx="14" fill="#fff" stroke="#0F6E74" stroke-width="1.6"/><text x="751" y="590" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A33">Parser containers (Python)</text><text x="751" y="616" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">flora-gw-parser-&lt;device_id&gt;</text><text x="751" y="637" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">one per enabled device</text><text x="751" y="658" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">raw frames → observations</text><rect x="1103" y="194" width="230" height="150" rx="14" fill="#000" opacity="0.05"/><rect x="1100" y="190" width="230" height="150" rx="14" fill="#fff" stroke="#0F6E74" stroke-width="1.6"/><text x="1116" y="220" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A33">collector (Rust)</text><text x="1116" y="246" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Batches gw.obs / logs /</text><text x="1116" y="267" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">measurements into DB</text><rect x="1103" y="384" width="230" height="140" rx="14" fill="#000" opacity="0.05"/><rect x="1100" y="380" width="230" height="140" rx="14" fill="#fff" stroke="#1B2A33" stroke-width="2"/><text x="1116" y="410" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A33">PostgreSQL 17</text><text x="1116" y="436" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">flora_gateway database</text><text x="1116" y="457" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Host port 7412</text><rect x="1103" y="564" width="230" height="150" rx="14" fill="#000" opacity="0.05"/><rect x="1100" y="560" width="230" height="150" rx="14" fill="#fff" stroke="#0F6E74" stroke-width="1.6"/><text x="1116" y="590" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A33">publisher (Rust)</text><text x="1116" y="616" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Pushes gw.obs to</text><text x="1116" y="637" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">configured HTTP targets</text><rect x="1383" y="194" width="200" height="150" rx="14" fill="#000" opacity="0.05"/><rect x="1380" y="190" width="200" height="150" rx="14" fill="#fff" stroke="#0F6E74" stroke-width="1.6"/><text x="1396" y="220" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A33">server (Rust)</text><text x="1396" y="246" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Vector-compatible</text><text x="1396" y="267" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">read API :8080</text><rect x="1383" y="384" width="200" height="140" rx="14" fill="#000" opacity="0.05"/><rect x="1380" y="380" width="200" height="140" rx="14" fill="#fff" stroke="#0F6E74" stroke-width="1.6"/><text x="1396" y="410" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A33">Kong 3.9</text><text x="1396" y="436" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">/data-api</text><text x="1396" y="457" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">per-Leaf routes</text><text x="1396" y="478" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">port 7410</text><rect x="1383" y="564" width="200" height="150" rx="14" fill="#000" opacity="0.05"/><rect x="1380" y="560" width="200" height="150" rx="14" fill="#fff" stroke="#0F6E74" stroke-width="1.6"/><text x="1396" y="590" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A33">nginx edge</text><text x="1396" y="616" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">HTTPS 443</text><text x="1396" y="637" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">/data-api → Kong</text><text x="1396" y="658" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">/ → admin UI</text><rect x="343" y="774" width="1240" height="110" rx="14" fill="#000" opacity="0.05"/><rect x="340" y="770" width="1240" height="110" rx="14" fill="#fff" stroke="#4A5A66" stroke-width="1.6"/><text x="356" y="800" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A33">updater sidecar (flora-updater)</text><text x="356" y="826" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Polls Haber for the approved gateway release, verifies the Ed25519 signature, pulls images by digest,</text><text x="356" y="847" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">runs docker compose up, health-checks and rolls back on failure. Parser images are replaced one per cycle.</text><rect x="1683" y="204" width="290" height="250" rx="14" fill="#000" opacity="0.05"/><rect x="1680" y="200" width="290" height="250" rx="14" fill="#DCE6F2" stroke="#3D5A80" stroke-width="1.6"/><text x="1696" y="230" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#3D5A80">Flora Leaf</text><text x="1696" y="256" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Bedside / OR workstation</text><text x="1696" y="277" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">device writer polls every 2 s</text><text x="1696" y="298" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">GET /data-api/&lt;leaf&gt;/api/</text><text x="1696" y="319" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">  observations?from&amp;to</text><text x="1696" y="340" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">→ vital_minutes per case</text><rect x="1683" y="524" width="290" height="250" rx="14" fill="#000" opacity="0.05"/><rect x="1680" y="520" width="290" height="250" rx="14" fill="#F6DDE0" stroke="#B5525C" stroke-width="1.6"/><text x="1696" y="550" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B5525C">Canopy + Haber</text><text x="1696" y="576" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">Hospital control plane</text><text x="1696" y="597" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">check-in every 20 s:</text><text x="1696" y="618" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">license, device types,</text><text x="1696" y="639" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">parser images, desired</text><text x="1696" y="660" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#4A5A66">config, alerts relay</text><defs><marker id="a1c75ud" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#3F5E66"/></marker></defs><path d="M260 330 L336 330" fill="none" stroke="#3F5E66" stroke-width="2.4"  marker-end="url(#a1c75ud)"/><text x="298" y="318"  text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4A5A66" font-weight="400">frames</text><defs><marker id="aeer5wi" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#3F5E66"/></marker></defs><path d="M670 300 L731 300" fill="none" stroke="#3F5E66" stroke-width="2.4"  marker-end="url(#aeer5wi)"/><defs><marker id="awkl0pe" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#3F5E66"/></marker></defs><path d="M885 520 L885 556" fill="none" stroke="#3F5E66" stroke-width="2.4"  marker-end="url(#awkl0pe)"/><defs><marker id="an4voo9" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#3F5E66"/></marker></defs><path d="M940 556 L940 524" fill="none" stroke="#3F5E66" stroke-width="2.4"  marker-end="url(#an4voo9)"/><defs><marker id="aqrm5qp" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#3F5E66"/></marker></defs><path d="M1035 260 L1096 260" fill="none" stroke="#3F5E66" stroke-width="2.4"  marker-end="url(#aqrm5qp)"/><defs><marker id="a45k7to" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#3F5E66"/></marker></defs><path d="M1215 340 L1215 376" fill="none" stroke="#3F5E66" stroke-width="2.4"  marker-end="url(#a45k7to)"/><defs><marker id="ab8c5te" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#3F5E66"/></marker></defs><path d="M1330 450 H1352 V265 H1376" fill="none" stroke="#3F5E66" stroke-width="2.4"  marker-end="url(#ab8c5te)"/><defs><marker id="agdhip6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#3F5E66"/></marker></defs><path d="M1480 340 L1480 376" fill="none" stroke="#3F5E66" stroke-width="2.4"  marker-end="url(#agdhip6)"/><defs><marker id="atew776" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#3F5E66"/></marker></defs><path d="M1480 520 L1480 556" fill="none" stroke="#3F5E66" stroke-width="2.4"  marker-end="url(#atew776)"/><defs><marker id="aq0it5x" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#3F5E66"/></marker></defs><path d="M1035 460 H1066 V630 H1096" fill="none" stroke="#3F5E66" stroke-width="2.4"  marker-end="url(#aq0it5x)"/><defs><marker id="aghw3qb" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#3F5E66"/></marker></defs><path d="M1580 630 H1630 V330 H1676" fill="none" stroke="#3F5E66" stroke-width="2.4"  marker-end="url(#aghw3qb)"/><text x="1620" y="480" transform="rotate(-90 1620 480)" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3D5A80" font-weight="700">pull (HTTPS)</text><defs><marker id="apxb2xn" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#B5525C"/></marker></defs><path d="M670 690 H700 V735 H1640 V650 H1676" fill="none" stroke="#B5525C" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#apxb2xn)"/><text x="1200" y="728" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B5525C">outbound check-in (works behind NAT)</text><defs><marker id="a2xashm" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#B5525C"/></marker></defs><path d="M1676 740 H1650 V830 H1584" fill="none" stroke="#B5525C" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#a2xashm)"/><text x="1660" y="800" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B5525C">releases</text><circle cx="300" cy="365" r="15" fill="#E8A33D"/><text x="300" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">1</text><circle cx="700" cy="290" r="15" fill="#E8A33D"/><text x="700" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">2</text><circle cx="910" cy="545" r="15" fill="#E8A33D"/><text x="910" y="550" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">3</text><circle cx="1060" cy="250" r="15" fill="#E8A33D"/><text x="1060" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">4</text><circle cx="1500" cy="365" r="15" fill="#E8A33D"/><text x="1500" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">5</text><circle cx="1650" cy="610" r="15" fill="#E8A33D"/><text x="1650" y="615" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">6</text></svg>