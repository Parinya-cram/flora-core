# Flora edge — TLS per tier on its own port (reach by IP:port, no DNS needed):
#   https://<vm-ip>:7443 -> Leaf   https://<vm-ip>:8443 -> Root   https://<vm-ip>:9443 -> Canopy
# nginx terminates TLS (self-signed *.flora cert) and proxies to each tier's web upstream.
name: flora-edge

services:
  edge:
    build:
      context: .
    ports:
      - "${LEAF_HTTPS_PORT:-7443}:7443"
      - "${ROOT_HTTPS_PORT:-8443}:8443"
      - "${CANOPY_HTTPS_PORT:-9443}:9443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Cloudflare quick tunnel (TryCloudflare) — FREE, no token/domain needed.
  # Random https://<random>.trycloudflare.com for external demo. Points at Leaf by
  # default; read the public URL from this container's logs after it starts.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://host.docker.internal:6890"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
