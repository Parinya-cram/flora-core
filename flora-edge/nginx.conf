# Flora edge — TLS per tier on its own port (no DNS needed, reach by IP:port):
#   https://<vm-ip>:7443 -> Leaf      https://<vm-ip>:8443 -> Root
#   https://<vm-ip>:9443 -> Canopy
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# --- Leaf : 7443 ---
server {
  listen 7443 ssl;
  ssl_certificate     /etc/nginx/certs/flora.crt;
  ssl_certificate_key /etc/nginx/certs/flora.key;
  location / {
    proxy_pass http://host.docker.internal:6890;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# --- Root : 8443 ---
server {
  listen 8443 ssl;
  ssl_certificate     /etc/nginx/certs/flora.crt;
  ssl_certificate_key /etc/nginx/certs/flora.key;
  location / {
    proxy_pass http://host.docker.internal:7100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# --- Canopy : 9443 ---
server {
  listen 9443 ssl;
  ssl_certificate     /etc/nginx/certs/flora.crt;
  ssl_certificate_key /etc/nginx/certs/flora.key;
  location / {
    proxy_pass http://host.docker.internal:6894;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
