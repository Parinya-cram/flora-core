# Flora edge — two ways in, both via nginx TLS:
#   1) hostname on 443 : https://leaf|root|canopy.flora.local   (needs DNS -> VM)
#   2) IP + per-tier port : https://<vm-ip>:7443 leaf / :8443 root / :9443 canopy
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# shared proxy settings
# (duplicated per block since nginx has no "include inline"; keep in sync)

# ---------- 80 -> redirect to https hostname ----------
server {
  listen 80 default_server;
  return 301 https://$host$request_uri;
}

# ================= hostname vhosts on 443 =================
server {
  listen 443 ssl;
  server_name leaf.flora.local;
  ssl_certificate /etc/nginx/certs/flora.crt;
  ssl_certificate_key /etc/nginx/certs/flora.key;
  location / {
    proxy_pass http://host.docker.internal:6890;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
server {
  listen 443 ssl;
  server_name root.flora.local;
  ssl_certificate /etc/nginx/certs/flora.crt;
  ssl_certificate_key /etc/nginx/certs/flora.key;
  location / {
    proxy_pass http://host.docker.internal:7100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
server {
  listen 443 ssl default_server;
  server_name canopy.flora.local;
  ssl_certificate /etc/nginx/certs/flora.crt;
  ssl_certificate_key /etc/nginx/certs/flora.key;
  location / {
    proxy_pass http://host.docker.internal:6894;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ================= per-tier TLS ports (reach by IP:port) =================
server {
  listen 7443 ssl;  # Leaf
  ssl_certificate /etc/nginx/certs/flora.crt;
  ssl_certificate_key /etc/nginx/certs/flora.key;
  location / {
    proxy_pass http://host.docker.internal:6890;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
server {
  listen 8443 ssl;  # Root
  ssl_certificate /etc/nginx/certs/flora.crt;
  ssl_certificate_key /etc/nginx/certs/flora.key;
  location / {
    proxy_pass http://host.docker.internal:7100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
server {
  listen 9443 ssl;  # Canopy
  ssl_certificate /etc/nginx/certs/flora.crt;
  ssl_certificate_key /etc/nginx/certs/flora.key;
  location / {
    proxy_pass http://host.docker.internal:6894;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
