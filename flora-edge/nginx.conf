# Flora edge — TLS termination + vhost → upstream (Leaf / Canopy / Root)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80 default_server;
  return 301 https://$host$request_uri;
}

# --- Leaf ---
server {
  listen 443 ssl;
  server_name leaf.flora.local;
  ssl_certificate     /etc/nginx/certs/flora.crt;
  ssl_certificate_key /etc/nginx/certs/flora.key;
  location / {
    proxy_pass http://host.docker.internal:6890;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# --- Canopy ---
server {
  listen 443 ssl;
  server_name canopy.flora.local;
  ssl_certificate     /etc/nginx/certs/flora.crt;
  ssl_certificate_key /etc/nginx/certs/flora.key;
  location / {
    proxy_pass http://host.docker.internal:6894;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# --- Root ---
server {
  listen 443 ssl;
  server_name root.flora.local;
  ssl_certificate     /etc/nginx/certs/flora.crt;
  ssl_certificate_key /etc/nginx/certs/flora.key;
  location / {
    proxy_pass http://host.docker.internal:7100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
