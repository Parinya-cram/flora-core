gateway_id = "gateway-hospital-01-a"

[kafka]
brokers = "kafka:9092"

[serial]
admin_port = 5001

[[serial.pods]]
id = "COM1"
path = "/dev/ttyV0"
baud = 9600
idle_ms = 80

[[serial.pods]]
id = "COM2"
path = "/dev/ttyV1"
baud = 9600
parity = "none"
idle_ms = 50
data_bits = 8
stop_bits = 1
flow_control = "none"

[feeder]
admin_port = 5002

[[feeder.pods]]
id = "icu-ventilator"
url = "http://simulator:8000/devices/icu-ventilator"
interval_ms = 5000

[webhook]
admin_port = 5003
pods = [
    { id = "or-anesthesia", port = 9003 },
]

[socket]
admin_port = 5004
pods = [
    { id = "or-monitor", port = 9001, framing = "mllp", auto_ack = true },
    { id = "icu-monitor", port = 9002, framing = "mllp", auto_ack = true },
    { id = "vista", port = 9500, framing = "raw", auto_ack = false },
    # Simulated Dräger M540s (m540-sim-N), relayed like tools/iacs-relay; one pod parser splits them by source_ip.
    # Keep udp_relay: the simulator sends over TCP with each monitor's source IP in the frame. A real M540
    # (IACS UDP multicast) uses its own transport = "udp" pod, see config/gateway.draeger.toml.
    { id = "m540-relay", port = 9510, framing = "udp_relay", auto_ack = false, max_frame_bytes = 6096 },
]

[collector]
admin_port = 5005
batch_size = 500
flush_ms = 500

[server]
listen = "0.0.0.0:8080"

[stream_hub]
listen = "0.0.0.0:7407"
admin_port = 5007
settle_ms = 300
max_unacked = 300

[publisher]
admin_port = 5006
targets = [
    { id = "demo-receiver", url = "http://simulator:8000/receiver", flush_ms = 2000 },
]
