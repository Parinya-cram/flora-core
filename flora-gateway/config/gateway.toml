gateway_id = "gateway-hospital-01-a"

[kafka]
brokers = "kafka:9092"

[serial]
admin_port = 5001

[[serial.pods]]
id = "COM1"
path = "/dev/ttyV0"
baud = 9600
idle_ms = 80

[[serial.pods]]
id = "COM2"
path = "/dev/ttyV1"
baud = 9600
parity = "none"
idle_ms = 50
data_bits = 8
stop_bits = 1
flow_control = "none"

[feeder]
admin_port = 5002

[[feeder.pods]]
id = "icu-ventilator"
url = "http://simulator:8000/devices/icu-ventilator"
interval_ms = 5000

[webhook]
admin_port = 5003
pods = [
    { id = "or-anesthesia", port = 9003 },
]

[socket]
admin_port = 5004
pods = [
    { id = "or-monitor", port = 9001, framing = "mllp", auto_ack = true },
    { id = "icu-monitor", port = 9002, framing = "mllp", auto_ack = true },
]

[collector]
admin_port = 5005
batch_size = 500
flush_ms = 500

[server]
listen = "0.0.0.0:8080"

[publisher]
admin_port = 5006
targets = [
    { id = "demo-receiver", url = "http://simulator:8000/receiver", flush_ms = 2000 },
]
