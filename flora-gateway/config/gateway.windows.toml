# Flora Gateway on Windows 10/11 — REAL COM ports only (no virtual ports, no simulator).          # config ของ gateway บน Windows: ใช้พอร์ต COM จริงเท่านั้น
# serial-controller runs natively on Windows (windows/start-gateway.ps1) and opens COMn directly;  # serial-controller รันบน Windows โดยตรงและเปิด COMn เอง
# every other controller runs in Docker Desktop (compose.windows.yaml).                            # controller อื่นรันใน Docker Desktop
gateway_id = "gateway-hospital-01-a"                    # รหัส gateway (ต้องตรงกับ FLORA_GATEWAY_ID ใน .env)

[kafka]                                                 # ที่อยู่ Kafka
brokers = "kafka:9092"                                  # ภายใน Docker (serial-controller บน Windows ใช้ FLORA_KAFKA_BROKERS=127.0.0.1:7414 แทน)

[serial]                                                # serial-controller (native บน Windows)
admin_port = 7501                                       # พอร์ตสถานะบน Windows (gateway-service เรียกผ่าน host.docker.internal:7501)

[[serial.pods]]                                         # พอร์ตจริงตัวที่ 1
id = "COM1"                                             # ชื่อ pod → serial.COM1
path = "COM1"                                           # ชื่อพอร์ตใน Windows Device Manager (Ports (COM & LPT))
baud = 19200                                            # ความเร็ว (ค่าของ MEDIBUS.X; หน้า admin ปรับตาม device type ให้เอง)
data_bits = 8                                           # 8 data bits
parity = "even"                                         # parity คู่
stop_bits = 1                                           # 1 stop bit
flow_control = "none"                                   # ไม่ใช้ flow control
rts = true                                              # จ่ายสัญญาณ RTS
dtr = true                                              # จ่ายสัญญาณ DTR
idle_ms = 20                                            # เงียบ 20 ms = จบ 1 ชุดข้อมูล
max_frame_bytes = 16384                                 # ขนาดสูงสุดต่อชุด

[[serial.pods]]                                         # พอร์ตจริงตัวที่ 2
id = "COM2"                                             # ชื่อ pod → serial.COM2
path = "COM2"                                           # ชื่อพอร์ตใน Windows (USB-RS232 มักเป็น COM3 ขึ้นไป ดูใน Device Manager)
baud = 9600                                             # ความเร็วเริ่มต้น (ปรับตาม device type ที่ใช้)
data_bits = 8                                           # 8 data bits
parity = "none"                                         # ไม่ใช้ parity
stop_bits = 1                                           # 1 stop bit
flow_control = "none"                                   # ไม่ใช้ flow control
idle_ms = 50                                            # เงียบ 50 ms = จบ 1 ชุดข้อมูล

[feeder]                                                # feeder-controller (Docker) ไปดึงข้อมูลจาก HTTP API ของเครื่อง
admin_port = 5002                                       # พอร์ตสถานะภายใน container
pods = []                                               # ยังไม่มีเครื่องแบบ HTTP poll (ไม่มีเครื่องจำลอง)

[webhook]                                               # webhook-controller (Docker) รับ HTTP POST จากเครื่อง
admin_port = 5003                                       # พอร์ตสถานะภายใน container
pods = [                                                # รายการ pod
    { id = "or-anesthesia", port = 9003 },              # เครื่องส่ง HTTP มาที่ <gateway>:7423
]                                                       # จบรายการ

[socket]                                                # socket-controller (Docker) รับ LAN TCP/UDP
admin_port = 5004                                       # พอร์ตสถานะภายใน container

[[socket.pods]]                                         # HL7 monitor
id = "or-monitor"                                       # ชื่อ pod → socket.or-monitor
port = 9001                                             # พอร์ตใน container (บน Windows คือ 7421)
framing = "mllp"                                        # HL7 MLLP
auto_ack = true                                         # ตอบ HL7 ACK อัตโนมัติ

[[socket.pods]]                                         # Dräger Vista 120 S (raw)
id = "icu-monitor"                                      # ชื่อ pod → socket.icu-monitor
port = 9002                                             # พอร์ตใน container (บน Windows คือ 7422)
framing = "raw"                                         # ข้อมูล binary
auto_ack = false                                        # ไม่ตอบ ACK

[[socket.pods]]                                         # Dräger M540/C700 ผ่าน iacs-relay
id = "m540-relay"                                       # ชื่อ pod → socket.m540-relay
port = 2051                                             # พอร์ตใน container (บน Windows คือ 2051)
framing = "udp_relay"                                   # รูปแบบของ relay
auto_ack = false                                        # ไม่ตอบ ACK
max_frame_bytes = 6096                                  # ขนาดสูงสุดต่อชุด

[collector]                                             # collector (Docker) บันทึกลงฐานข้อมูล
admin_port = 5005                                       # พอร์ตสถานะภายใน container
batch_size = 500                                        # บันทึกทีละ 500 แถว
flush_ms = 500                                          # หรือทุก 500 ms

[server]                                                # server (Docker) API อ่านค่า
listen = "0.0.0.0:8080"                                 # ฟังภายใน container

[publisher]                                             # publisher (Docker) ส่งค่าออกไประบบปลายทาง
admin_port = 5006                                       # พอร์ตสถานะภายใน container
targets = []                                            # ยังไม่มีปลายทาง (ไม่ใช้เครื่องจำลอง)
