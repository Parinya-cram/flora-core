<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESM Flora Gateway · Sign in</title>
<style>
  :root { --bg:#f6f7f4; --panel:#ffffff; --ink:#1d2621; --muted:#65706a; --line:#e2e6e1; --accent:#2f6f4f; --bad:#b23b3b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121614; --panel:#1a201d; --ink:#e4ebe6; --muted:#9aa59f;
          --line:#2a332e; --accent:#6dbb8f; --bad:#e07a7a; } }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; padding:16px }
  form { width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:24px }
  h1 { font-size:18px; margin:0 0 4px } p { margin:0 0 18px; color:var(--muted) }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px }
  input { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink) }
  button { margin-top:18px; width:100%; font:inherit; font-weight:600; padding:9px; border:0; border-radius:6px;
           background:var(--accent); color:#fff; cursor:pointer }
  #error { color:var(--bad); min-height:20px; margin-top:10px; font-size:13px }

  /* FLORA iCIS wordmark (same as the Leaf/Canopy apps): FLORA in the page's text colour, iCIS cyan → blue + pink dot. */
  .wm { display:inline-flex !important; align-items:baseline; font-weight:900; letter-spacing:.03em; line-height:1; white-space:nowrap }
  .wm, .wm span { font-size:inherit !important }
  .wm .fl { display:inline !important; color:var(--ink, var(--text, #1d2621)) !important }
  .wm .ic { display:inline !important; margin-left:.24em; background:linear-gradient(90deg,#1bb8d4,#2f6fe8); -webkit-background-clip:text; background-clip:text; color:transparent !important }
  .wm .i { display:inline !important; position:relative }
  .wm .dot { display:block !important; position:absolute; left:50%; top:.04em; width:.19em; height:.19em; transform:translateX(-50%); border-radius:50%; background:#ef4a82 }
  .wm-part { display:inline-block !important; margin-left:8px; font-size:11px !important; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--muted) !important }
</style>
</head>
<body>
<form id="form">
  <h1 style="font-size:24px"><span class="wm" role="img" aria-label="Flora iCIS"><span class="fl">FLORA</span><span class="ic"><span class="i">ı<span class="dot"></span></span>CIS</span></span><span class="wm-part">Gateway</span></h1>
  <p id="station">Station admin sign-in</p>
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <div id="error" role="alert"></div>
</form>
<script>
fetch("api/site/label").then((r) => r.json()).then((s) => {
  const where = s.label ? `${s.label} · ${s.gateway_id}` : s.gateway_id;
  document.getElementById("station").textContent = `Sign in to ${where}`;
  document.title = `${s.label || s.gateway_id} · Sign in — ESM Flora Gateway`;
}).catch(() => {});
document.getElementById("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const error = document.getElementById("error");
  error.textContent = "";
  const response = await fetch("api/auth/login", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ username: event.target.username.value, password: event.target.password.value }),
  });
  if (response.ok) { location.href = "/"; return; }
  error.textContent = (await response.json().catch(() => ({}))).detail || "Sign-in failed";
});
</script>
</body>
</html>
