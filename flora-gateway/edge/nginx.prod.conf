# Flora Gateway edge for gateway.floraicis.prod.yml: plain HTTP on 7400 (host side).
# TLS, if any, is terminated by a proxy in front of it. Device feeds (HL7 MLLP,
# serial/socket, webhooks) are not HTTP and keep their own ports.
#
#   /data-api/ → kong (Leafs read observations here)
#   /          → gateway-service (admin UI and API)

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
    proxy_connect_timeout 5s;

    set $kong    kong:8000;
    set $gateway gateway-service:8000;

    location /data-api/ { proxy_pass http://$kong; }
    location /          { proxy_pass http://$gateway; }
}
