# Flora Haber — the hospital's device control plane + image mirror, as its OWN stack.
#
# Split out of flora-canopy so the device-distribution appliance (approve releases, mirror
# images, serve nodes) runs, ships and scales on its own — and maps cleanly to a k8s
# deployment later. Haber no longer reads canopy-db directly: it reads Leaf nodes over HTTP
# from sync-api (GET /api/sync/v1/leaves), so the only cross-stack link is the network.
#
# One-time setup on the host before first deploy:
#   docker network create flora_shared
# (flora-canopy's sync-api + canopy-api join the same external network — see README.md.)
#
# Deploy:  export FLORA_BIND_ADDR=0.0.0.0
#          docker-compose -p flora-haber -f flora-haber/compose.server.yaml up -d --build

name: flora-haber

networks:
  default:
  flora_shared:
    external: true

services:
  # The hospital's copy of every approved Flora image. Only Haber writes to it; nodes pull.
  haber-registry:
    image: registry:3
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      OTEL_TRACES_EXPORTER: none
    ports:
      - "${FLORA_BIND_ADDR:-127.0.0.1}:${HABER_REGISTRY_PORT:-7205}:5000"
    volumes:
      - haber_registry_data:/var/lib/registry
    restart: unless-stopped

  haber:
    build:
      # Reuse the Haber source in place; no duplication.
      context: ../flora-canopy/haber
    environment:
      FLORA_ROOT_URL: ${FLORA_ROOT_URL:-http://host.docker.internal:7100}
      FLORA_TENANT_ID: ${FLORA_TENANT_ID:-hospital-01}
      FLORA_ROOT_TENANT_KEY: ${FLORA_ROOT_TENANT_KEY:-root-tenant-demo-key}
      FLORA_ROOT_PUBLIC_KEY: ${FLORA_ROOT_PUBLIC_KEY:-}
      HABER_GATEWAY_TOKEN: ${HABER_GATEWAY_TOKEN:-haber-gateway-demo-token}
      HABER_NODE_TOKEN: ${HABER_NODE_TOKEN:-haber-node-demo-token}
      HABER_ADMIN_USERNAME: admin
      HABER_ADMIN_PASSWORD: admin
      # Decoupled: Leaf list comes from sync-api over HTTP (shared network), not canopy-db.
      FLORA_CANOPY_SYNC_URL: ${FLORA_CANOPY_SYNC_URL:-http://sync-api:8000}
      FLORA_SYNC_SHARED_SECRET: ${FLORA_SYNC_SHARED_SECRET:-admin}
      HABER_REGISTRY_URL: http://haber-registry:5000
      HABER_REGISTRY_PUBLIC: ${HABER_REGISTRY_PUBLIC:-172.22.1.151:7205}
      HABER_ROOT_SYNC_SEC: ${HABER_ROOT_SYNC_SEC:-15}
    ports:
      - "${FLORA_BIND_ADDR:-127.0.0.1}:${HABER_PORT:-7204}:8000"
    volumes:
      - haber_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      haber-registry:
        condition: service_started
    networks:
      - default
      - flora_shared      # reach sync-api (and be reachable by canopy-api / edge)
    restart: unless-stopped

volumes:
  haber_data:
  haber_registry_data:
