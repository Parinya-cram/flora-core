# Flora Canopy edge for canopy.floraicis.prod.yml: plain HTTP on 7200 (host side).
# TLS, if any, is terminated by a proxy in front of it.
#
#   /api/sync/   → sync-api        Leaf sync worker, Leaf login/directory, Haber
#   /api/haber/  → haber           Gateway check-in, flora-updater on every node
#   /haber/      → haber (UI)      Haber admin page (account demo)
#   /haber/<account>/ → haber-<account>  that account's Haber (UI + /api/haber/), e.g. /haber/kcmh/
#   /v2/         → haber-registry  Docker pulls of approved images
#   /mcp         → flora-mcp       MCP server for AI agents (Canopy API key)
#   /api/, /health → canopy-api
#   /            → canopy-web      Canopy viewer (static production build)

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;
    proxy_http_version 1.1;
    # $http_host keeps the published port, so registry Location headers stay reachable.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
    # Fail fast when a Canopy service is down, so Leaves and Gateways retry next cycle.
    proxy_connect_timeout 5s;

    set $sync_api       sync-api:8000;
    set $haber          haber:8000;
    set $registry       haber-registry:5000;
    set $canopy_api     canopy-api:8000;
    set $canopy_web     canopy-web:80;
    set $flora_mcp      flora-mcp:8000;

    location /api/sync/  { proxy_pass http://$sync_api; }
    location /api/haber/ { proxy_pass http://$haber; }

    location = /haber    { return 301 /haber/; }
    # One Haber per account: /haber/<account>/… (UI and /api/haber/ for that hospital's nodes).
    location ~ ^/haber/(demo|kcmh|nit)$ { return 301 /haber/$1/; }
    location ~ ^/haber/(demo|kcmh|nit)/ {
        set $account_haber haber-$1:8000;
        rewrite ^/haber/[^/]+/(.*)$ /$1 break;
        proxy_pass http://$account_haber;
    }
    location /haber/ {
        rewrite ^/haber/(.*)$ /$1 break;
        proxy_pass http://$haber;
    }

    location /v2/ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_pass http://$registry;
    }

    location = /mcp {
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://$flora_mcp;
    }

    location /api/        { proxy_pass http://$canopy_api; }
    location = /health    { proxy_pass http://$canopy_api; }
    location = /docs          { proxy_pass http://$canopy_api; }
    location = /openapi.json  { proxy_pass http://$canopy_api; }

    location / { proxy_pass http://$canopy_web; }
}
