# Flora Canopy edge: the only port Leaves, Gateways and browsers need (443).
# Every connection starts outside Canopy; nothing here calls a Leaf or Gateway.
#
#   /api/sync/   → sync-api        Leaf sync worker, Leaf login/directory, Haber
#   /api/haber/  → haber           Gateway check-in, flora-updater on every node
#   /haber/      → haber (UI)      Haber admin page
#   /v2/         → haber-registry  Docker pulls of approved images
#   /mcp         → flora-mcp      MCP server for AI agents (Canopy API key)
#   /api/, /health → canopy-api
#   /            → canopy-web      Canopy viewer

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# Resolve upstreams per request so the edge starts even if one service is down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/canopy.crt;
    ssl_certificate_key /etc/nginx/certs/canopy.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    # Fail fast when a Canopy service is down (default is 60 s), so Leaves and
    # Gateways see 502/504 at once and retry on their next cycle.
    proxy_connect_timeout 5s;

    set $sync_api       sync-api:8000;
    set $haber          haber:8000;
    set $registry       haber-registry:5000;
    set $canopy_api     canopy-api:8000;
    set $canopy_web     canopy-web:5173;
    set $flora_mcp      flora-mcp:8000;

    location /api/sync/  { proxy_pass http://$sync_api; }
    location /api/haber/ { proxy_pass http://$haber; }

    location = /haber    { return 301 /haber/; }
    location /haber/ {
        rewrite ^/haber/(.*)$ /$1 break;
        proxy_pass http://$haber;
    }

    location /v2/ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_pass http://$registry;
    }

    # MCP for AI agents (Streamable HTTP; responses may stream, so no buffering).
    location = /mcp {
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://$flora_mcp;
    }

    location /api/        { proxy_pass http://$canopy_api; }
    location = /health    { proxy_pass http://$canopy_api; }
    # OpenAPI docs of the Canopy API (public API v1 lives under /api/v1).
    location = /docs          { proxy_pass http://$canopy_api; }
    location = /openapi.json  { proxy_pass http://$canopy_api; }

    location / {
        # The dev viewer (Vite) only answers to localhost; a production build is static.
        proxy_set_header Host localhost;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://$canopy_web;
    }
}
