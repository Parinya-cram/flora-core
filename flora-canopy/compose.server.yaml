# Flora Canopy (hospital central) — own DB, receives Leaf syncs, licenses gateways via Haber.
# VM deploy via Portainer. Set FLORA_BIND_ADDR=0.0.0.0.
#
# Haber + haber-registry now live in the flora-haber stack (see ../flora-haber). canopy-api
# and sync-api join the external `flora_shared` network to reach Haber by service name.
# One-time: docker network create flora_shared
name: flora-canopy

networks:
  default:
  flora_shared:
    external: true

services:
  canopy-db:
    build:
      context: ..
      dockerfile: Dockerfile.postgres.dev
    environment:
      POSTGRES_DB: ${FLORA_POSTGRES_DB:-flora}
      POSTGRES_USER: ${FLORA_POSTGRES_ADMIN_USER:-flora_admin}
      POSTGRES_PASSWORD: ${FLORA_POSTGRES_ADMIN_PASSWORD:-admin}
      FLORA_DB_APP_PASSWORD: ${FLORA_DB_APP_PASSWORD:-admin}
      FLORA_DB_VIEW_PASSWORD: ${FLORA_DB_VIEW_PASSWORD:-admin}
      FLORA_DB_SYNC_PASSWORD: ${FLORA_DB_SYNC_PASSWORD:-admin}
    ports:
      - "${FLORA_BIND_ADDR:-127.0.0.1}:${FLORA_CANOPY_DB_PORT:-6902}:5432"
    volumes:
      - flora_canopy_pgdata_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 300s
    restart: unless-stopped

  canopy-api:
    build:
      context: ../services/flora-api
    environment:
      FLORA_DATABASE_URL: postgresql://flora_view:${FLORA_DB_VIEW_PASSWORD:-admin}@canopy-db:5432/${FLORA_POSTGRES_DB:-flora}
      FLORA_API_ENV: development
      FLORA_API_MODE: canopy
      FLORA_CANOPY_SESSION_SECRET: ${FLORA_CANOPY_SESSION_SECRET:-admin}
      FLORA_BOOTSTRAP_ADMIN_ENABLED: "true"
      FLORA_BOOTSTRAP_ADMIN_USERNAME: admin
      FLORA_BOOTSTRAP_ADMIN_PASSWORD: admin
      FLORA_BOOTSTRAP_ADMIN_NAME: Administrator
      # Haber runs in the flora-haber stack, reached over flora_shared by service name.
      FLORA_HABER_URL: ${FLORA_HABER_URL:-http://haber:8000}
      HABER_ADMIN_USERNAME: ${HABER_ADMIN_USERNAME:-admin}
      HABER_ADMIN_PASSWORD: ${HABER_ADMIN_PASSWORD:-admin}
    ports:
      - "${FLORA_BIND_ADDR:-127.0.0.1}:${FLORA_CANOPY_API_PORT:-6895}:8000"
    depends_on:
      canopy-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - default
      - flora_shared      # reach Haber (flora-haber stack)
    restart: unless-stopped

  sync-api:
    build:
      context: ../services/flora-api
    environment:
      FLORA_DATABASE_URL: postgresql://flora_sync:${FLORA_DB_SYNC_PASSWORD:-admin}@canopy-db:5432/${FLORA_POSTGRES_DB:-flora}
      FLORA_API_ENV: development
      FLORA_API_MODE: sync
      FLORA_SYNC_SHARED_SECRET: ${FLORA_SYNC_SHARED_SECRET:-admin}
    ports:
      - "${FLORA_BIND_ADDR:-127.0.0.1}:${FLORA_SYNC_API_PORT:-6896}:8000"
    depends_on:
      canopy-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - default
      - flora_shared      # Haber reads the Leaf list here (GET /api/sync/v1/leaves)
    restart: unless-stopped

  canopy-web:
    build:
      context: ..
      dockerfile: Dockerfile.frontend.prod
      args:
        FLORA_SURFACE: canopy
    environment:
      API_UPSTREAM: http://canopy-api:8000
    ports:
      - "${FLORA_CANOPY_PORT:-6894}:80"
    depends_on:
      canopy-api:
        condition: service_healthy
    restart: unless-stopped

  # haber + haber-registry moved to the flora-haber stack (../flora-haber/compose.server.yaml).

volumes:
  flora_canopy_pgdata_v2:
