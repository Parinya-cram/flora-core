# Dev only: hot-reload the APIs from source. Loaded automatically by a plain
# `docker compose up` in this directory; demo/up.sh and release-managed nodes use
# `-f compose.yaml` alone so the release image's code is what runs.
services:
  canopy-api:
    volumes:
      - ../services/flora-api/app:/app/app:ro
  sync-api:
    volumes:
      - ../services/flora-api/app:/app/app:ro
  flora-mcp:
    volumes:
      - ../services/flora-mcp:/app/src:ro
    command: ["uvicorn", "server:app", "--app-dir", "/app/src", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--reload", "--reload-dir", "/app/src"]
