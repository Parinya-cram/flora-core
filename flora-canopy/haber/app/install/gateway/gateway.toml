# Flora iCIS gateway — starting configuration written by gateway.sh (no devices yet).
# Add ports and devices in the gateway admin page; it edits this file and restarts the controllers.
gateway_id = "__GATEWAY_ID__"

[kafka]
brokers = "kafka:9092"

[serial]
admin_port = 5001
pods = []

[feeder]
admin_port = 5002
pods = []

[webhook]
admin_port = 5003
pods = []

[socket]
admin_port = 5004
pods = []

[collector]
admin_port = 5005
batch_size = 500
flush_ms = 500

[server]
listen = "0.0.0.0:8080"

[stream_hub]
listen = "0.0.0.0:7407"
admin_port = 5007
settle_ms = 300
max_unacked = 300

[publisher]
admin_port = 5006
targets = []
