# Flora Gateway edge: admin UI/API and the Leafs' data API over HTTPS (443 in
# production; GATEWAY_HTTPS_PORT in .env on a dev machine). Device feeds (HL7 MLLP,
# serial/socket, webhooks) are not HTTP and keep their own ports.
#
#   /data-api/ → kong (Leafs read observations here)
#   /          → gateway-service (admin UI and API)

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Paths come from TLS_CERT_FILE / TLS_KEY_FILE in .env.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_connect_timeout 5s;

    set $kong    kong:8000;
    set $gateway gateway-service:8000;

    location /data-api/ { proxy_pass http://$kong; }
    location /          { proxy_pass http://$gateway; }
}
