# Flora Leaf edge: the bedside viewer and its API over HTTPS (443 in production;
# LEAF_HTTPS_PORT in env/<leaf>.env on a dev machine running several Leafs).
# The desktop app keeps using the API on 127.0.0.1 (loopback only).
#
#   /api/, /health → leaf-api
#   /              → leaf-web

map $http_upgrade $connection_upgrade { default upgrade; "" close; }
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Paths come from TLS_CERT_FILE / TLS_KEY_FILE in the Leaf's env file.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_connect_timeout 5s;

    set $leaf_api leaf-api:8000;
    set $leaf_web leaf-web:5173;

    location /api/     { proxy_pass http://$leaf_api; }
    location = /health { proxy_pass http://$leaf_api; }

    location / {
        # The dev viewer (Vite) only answers to localhost; a production build is static.
        proxy_set_header Host localhost;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://$leaf_web;
    }
}
