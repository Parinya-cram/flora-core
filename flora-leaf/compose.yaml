# Flora Leaf — one bedside/OR workstation: local Postgres, Leaf API, Leaf UI and
# the sync worker that talks to Canopy. Electron points at the Leaf API port.
# Ports: 73xx, 10 per instance (see ../demo/PORTS.md).
#
# Run one instance per env file, each as its own compose project:
#   docker compose -p flora-leaf-or-01  --env-file env/leaf-or-01.env  up -d --build
#   docker compose -p flora-leaf-icu-01 --env-file env/leaf-icu-01.env up -d --build
#
# Builds from the shared source in ../services and ../frontend. Once Haber has an
# approved leaf release, the updater swaps leaf-api and leaf-sync to the release
# images (FLORA_IMAGE_API / FLORA_IMAGE_SYNC in .release/<project>.env), but never
# while a case is open. compose.override.yaml (dev only) mounts the source instead.

services:
  leaf-db:
    build:
      context: ..
      dockerfile: Dockerfile.postgres.dev
    environment:
      POSTGRES_DB: flora
      POSTGRES_USER: flora_admin
      POSTGRES_PASSWORD: ${LEAF_DB_ADMIN_PASSWORD:-flora-leaf-admin-local-only}
      FLORA_DB_APP_PASSWORD: ${LEAF_DB_APP_PASSWORD:-flora-leaf-app-local-only}
      FLORA_DB_VIEW_PASSWORD: ${LEAF_DB_VIEW_PASSWORD:-flora-leaf-view-local-only}
      FLORA_DB_SYNC_PASSWORD: ${LEAF_DB_SYNC_PASSWORD:-flora-leaf-sync-local-only}
    ports:
      - "127.0.0.1:${LEAF_DB_PORT:-7302}:5432"
    volumes:
      - leaf_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flora_admin -d flora"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  leaf-api:
    build:
      context: ../services/flora-api
    image: ${FLORA_IMAGE_API:-flora-leaf-api:dev}
    # Optional private CA for Canopy's TLS edge (demo/install-canopy-ca.sh). With a
    # publicly trusted Canopy certificate, certs/ stays empty and nothing changes.
    env_file:
      - path: ./certs/trust.env
        required: false
    environment:
      FLORA_DATABASE_URL: postgresql://flora_app:${LEAF_DB_APP_PASSWORD:-flora-leaf-app-local-only}@leaf-db:5432/flora
      FLORA_API_ENV: development
      FLORA_API_MODE: leaf
      FLORA_LEAF_WRITE_API: "true"
      FLORA_BOOTSTRAP_ADMIN_ENABLED: "true"
      FLORA_BOOTSTRAP_ADMIN_USERNAME: ${LEAF_ADMIN_USERNAME:-admin}
      FLORA_BOOTSTRAP_ADMIN_PASSWORD: ${LEAF_ADMIN_PASSWORD:-admin}
      FLORA_BOOTSTRAP_ADMIN_MUST_CHANGE_PASSWORD: ${FLORA_BOOTSTRAP_ADMIN_MUST_CHANGE_PASSWORD:-false}
      FLORA_BOOTSTRAP_ADMIN_NAME: Administrator
      FLORA_DEVICE_INGEST_ENABLED: "true"
      FLORA_LEAF_SERVICE_SECRET: ${FLORA_LEAF_SERVICE_SECRET:-flora-leaf-service-demo-secret-change-me}
      FLORA_CANOPY_SYNC_URL: ${CANOPY_SYNC_URL:-https://host.docker.internal}
      FLORA_SYNC_SHARED_SECRET: ${FLORA_SYNC_SHARED_SECRET:-flora-sync-demo-secret-change-me}
      FLORA_ACCOUNT_CONFIG_SYNC_TIMEOUT_SECONDS: "1.5"
      # Leaf identity for directory sign-in (users of this Leaf's ward, checked by Canopy).
      FLORA_LEAF_ID: ${FLORA_LEAF_ID:-leaf-or-01}
      # Leaf pulls device data from its Flora Gateway data-api (Vector-compatible).
      VECTOR_READ_URL: ${LEAF_DEVICE_READ_URL:-http://host.docker.internal:7410/data-api/leaf-or-01/api/observations}
      HIS_GATEWAY_BASE_URL: ${HIS_GATEWAY_BASE_URL:-http://127.0.0.1:9}
      FLORA_HIS_DEMO_MODE: ${FLORA_HIS_DEMO_MODE:-true}
    ports:
      # Electron: FLORA_API_BASE_URL=http://127.0.0.1:<LEAF_API_PORT>
      - "127.0.0.1:${LEAF_API_PORT:-7301}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      leaf-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    volumes:
      - ./certs:/etc/flora/certs:ro
  leaf-web:
    build:
      context: ..
      dockerfile: Dockerfile.frontend.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_FLORA_SURFACE: leaf
      VITE_API_PROXY_TARGET: http://leaf-api:8000
    ports:
      - "${LEAF_WEB_PORT:-7300}:5173"
    volumes:
      - ../frontend:/app/frontend:ro
      - leaf_frontend_modules:/app/frontend/node_modules
    command: ["sh", "-c", "npm ci --ignore-scripts --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    depends_on:
      leaf-api: {condition: service_healthy}
    restart: unless-stopped

  leaf-sync:
    build:
      context: ../services/flora-sync-worker
    image: ${FLORA_IMAGE_SYNC:-flora-leaf-sync:dev}
    # Optional private CA for Canopy's TLS edge (demo/install-canopy-ca.sh). With a
    # publicly trusted Canopy certificate, certs/ stays empty and nothing changes.
    env_file:
      - path: ./certs/trust.env
        required: false
    environment:
      FLORA_LEAF_API_URL: http://leaf-api:8000
      FLORA_CANOPY_SYNC_URL: ${CANOPY_SYNC_URL:-https://host.docker.internal}
      FLORA_SYNC_SHARED_SECRET: ${FLORA_SYNC_SHARED_SECRET:-flora-sync-demo-secret-change-me}
      FLORA_LEAF_SERVICE_SECRET: ${FLORA_LEAF_SERVICE_SECRET:-flora-leaf-service-demo-secret-change-me}
      FLORA_LEAF_ID: ${FLORA_LEAF_ID:-leaf-or-01}
      FLORA_HOSPITAL_ID: ${FLORA_HOSPITAL_ID:-hospital-01}
      FLORA_LEAF_NAME: ${FLORA_LEAF_NAME:-Operating Room 1}
      FLORA_SYNC_INTERVAL_SECONDS: ${FLORA_SYNC_INTERVAL_SECONDS:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      leaf-api: {condition: service_healthy}
    restart: unless-stopped


  # Keeps this project on the release approved in Haber (see ../flora-updater).
    volumes:
      - ./certs:/etc/flora/certs:ro
  updater:
    build:
      context: ../flora-updater
    image: ${FLORA_IMAGE_UPDATER:-flora-updater:dev}
    # Optional private CA for Canopy's TLS edge (demo/install-canopy-ca.sh). With a
    # publicly trusted Canopy certificate, certs/ stays empty and nothing changes.
    env_file:
      - path: ./certs/trust.env
        required: false
    environment:
      FLORA_COMPONENT: leaf
      FLORA_NODE_ID: ${FLORA_LEAF_ID:-leaf-or-01}
      HABER_URL: ${HABER_URL:-https://host.docker.internal}
      HABER_NODE_TOKEN: ${HABER_NODE_TOKEN:-haber-node-demo-token}
      FLORA_ROOT_PUBLIC_KEY: ${FLORA_ROOT_PUBLIC_KEY:-}
      FLORA_UPDATER_WINDOW: ${FLORA_UPDATER_WINDOW:-}
      # Safety gate: no update while this Leaf has an active case.
      FLORA_UPDATER_GATE_URL: http://leaf-api:8000/api/case/status
      FLORA_UPDATER_GATE_HEADER: "x-flora-service-secret: ${FLORA_LEAF_SERVICE_SECRET:-flora-leaf-service-demo-secret-change-me}"
    volumes:
      - ./certs:/etc/flora/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # The compose project's parent directory; the updater re-runs compose against it.
      - ..:/host
      - updater_state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  updater_state:
  leaf_db_data:
  leaf_frontend_modules:
