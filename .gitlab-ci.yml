# Flora Core pipeline for the shared development server.
#
# The deploy job expects a GitLab Runner with the "shell" executor running on
# the server itself, tagged `flora-dev`, whose user can run docker and owns the
# checkout at $DEPLOY_PATH.  Nothing here holds credentials: the server keeps
# its own untracked .env.
#
# Required CI/CD variable (Settings > CI/CD > Variables):
#   DEPLOY_PATH   absolute path of the checkout on the server, e.g. /opt/flora

stages: [validate, test, deploy]

default:
  interruptible: true

# ---------------------------------------------------------------- validate
compose-config:
  stage: validate
  tags: [flora-dev]
  script:
    - docker compose -f compose.dev.yaml --profile canopy --profile multi-leaf config >/dev/null
    - docker compose -f flora-gateway/compose.yaml config >/dev/null
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

python-compile:
  stage: validate
  tags: [flora-dev]
  script:
    - python3 -m compileall -q services/flora-api/app services/flora-sync-worker
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

frontend-build:
  stage: validate
  tags: [flora-dev]
  # Runs on the same shell runner as the other jobs by driving a throwaway
  # node container.  --user keeps any files it writes owned by gitlab-runner
  # so the next pipeline's checkout can clean them.
  script:
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -e HOME=/tmp -e npm_config_cache=/tmp/.npm
      -v "$CI_PROJECT_DIR/frontend:/app/frontend"
      -w /app/frontend
      node:22-bookworm-slim
      sh -c "npm ci --no-audit --no-fund && npm run build"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------- test
# Automated tests gate the deploy stage: a red test job means deploy-dev never runs.
# Both drive a throwaway container on the shell runner (same pattern as frontend-build).

test-frontend:
  stage: test
  tags: [flora-dev]
  script:
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -e HOME=/tmp -e npm_config_cache=/tmp/.npm
      -v "$CI_PROJECT_DIR:/app"
      -w /app/frontend
      node:22-bookworm-slim
      sh -c "npm ci --no-audit --no-fund && npx vitest run tests"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

test-api:
  stage: test
  tags: [flora-dev]
  # Runs as root inside an ephemeral container: deps install into the container's own
  # site-packages (not the mounted source), and PYTHONDONTWRITEBYTECODE keeps the mount clean.
  # Covers the SQLite-backed formdev + AI-builder suites (no external database needed), and reading documents into
  # forms: the Noto fonts draw the synthetic Thai form and the OCR models are fetched as the API image fetches them
  # (pinned, SHA256-checked), so those tests run here instead of being skipped.
  script:
    - >
      docker run --rm
      -e HOME=/tmp -e PYTHONPATH=/app/services/flora-api -e PYTHONDONTWRITEBYTECODE=1
      -e FLORA_OCR_MODELS=/tmp/flora-ocr -e PYTHAINLP_DATA=/tmp/pythainlp-data
      -v "$CI_PROJECT_DIR:/app"
      -w /app/services/flora-api
      python:3.13-slim
      sh -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-noto-core >/dev/null
      && pip install --quiet --no-cache-dir -r requirements.txt pytest
      && python scripts/fetch_ocr_models.py /tmp/flora-ocr
      && python -m pytest tests/formdev tests/test_case_forms_merge.py -q"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

test-db:
  stage: test
  tags: [flora-dev]
  # PostgreSQL-backed API tests (Leaf writes, case forms, Leaf sync, hospital profile, case documents) on a throwaway database server
  # built as a new install builds it (every script of Dockerfile.postgres.dev), with its own network and API image;
  # scripts/ci-test-db.sh removes all three afterwards and never touches the dev stack.
  script:
    - sh scripts/ci-test-db.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

test-worker:
  stage: test
  tags: [flora-dev]
  # The sync worker's own rules (snapshot history, Canopy refusing an old protocol), without servers.
  script:
    - >
      docker run --rm
      -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1
      -v "$CI_PROJECT_DIR:/app"
      -w /app/services/flora-sync-worker
      python:3.13-slim
      sh -c "pip install --quiet --no-cache-dir -r requirements.txt && python -m unittest discover -s tests"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------- deploy
deploy-dev:
  stage: deploy
  tags: [flora-dev]
  environment:
    name: development
    url: http://172.22.1.103:6890
  resource_group: flora-dev-server   # never two deploys at once
  script:
    - cd "$DEPLOY_PATH"
    - ./scripts/server/deploy.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
