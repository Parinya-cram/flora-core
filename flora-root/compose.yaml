# Flora Root — cloud control plane: tenants, licenses, releases, global configuration.
# Ports: 71xx (see ../demo/PORTS.md). Run: docker compose up -d --build
name: flora-root

services:
  root-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: flora_root
      POSTGRES_USER: flora_root
      POSTGRES_PASSWORD: ${FLORA_ROOT_DB_PASSWORD:-flora-root-local-only}
    ports:
      - "127.0.0.1:${FLORA_ROOT_DB_PORT:-7102}:5432"
    volumes:
      - root_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flora_root -d flora_root"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  root-api:
    build:
      context: ./api
    image: flora-root-api:dev
    environment:
      FLORA_ROOT_DATABASE_URL: postgresql://flora_root:${FLORA_ROOT_DB_PASSWORD:-flora-root-local-only}@root-db:5432/flora_root
      # Empty = admin API open (demo only). Set a long random value anywhere else.
      ROOT_ADMIN_KEY: ${ROOT_ADMIN_KEY:-}
      ROOT_ADMIN_USERNAME: ${ROOT_ADMIN_USERNAME:-admin}
      ROOT_ADMIN_PASSWORD: ${ROOT_ADMIN_PASSWORD:-admin}
      ROOT_SEED_DEMO: ${ROOT_SEED_DEMO:-true}
      ROOT_DEMO_TENANT_ID: ${ROOT_DEMO_TENANT_ID:-hospital-01}
      ROOT_DEMO_TENANT_KEY: ${ROOT_DEMO_TENANT_KEY:-root-tenant-demo-key}
      # Registry address handed to every Haber in the signed release manifest (via the edge).
      ROOT_REGISTRY_URL: ${ROOT_REGISTRY_URL:-https://host.docker.internal:${ROOT_HTTPS_PORT:-443}}
    ports:
      # Local debugging only; Canopies reach Root through the edge (443).
      - "127.0.0.1:${FLORA_ROOT_PORT:-7100}:8000"
    depends_on:
      root-db: {condition: service_healthy}
    restart: unless-stopped

  # Every Flora image is built by Root CI and pushed here; Haber mirrors from it.
  # Production: TLS + token auth in front of it (pull-only credentials per tenant).
  root-registry:
    image: registry:3
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      OTEL_TRACES_EXPORTER: none
    ports:
      - "127.0.0.1:${FLORA_ROOT_REGISTRY_PORT:-7105}:5000"
    volumes:
      - root_registry_data:/var/lib/registry
    restart: unless-stopped

  # Single public entry point: 443 in production (8443 on a dev machine that also runs
  # Canopy). Canopies (Haber) reach Root as https://<root-host>; see edge/nginx.conf.
  edge:
    image: nginx:1.27-alpine
    ports:
      - "${ROOT_HTTPS_PORT:-443}:443"
      - "${ROOT_HTTP_PORT:-80}:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./edge/certs:/etc/nginx/certs:ro
    depends_on:
      - root-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/api/v1/keys || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  root_db_data:
  root_registry_data:
