# Flora Root — cloud control plane: tenants, licenses, releases, global configuration.
# Ports: 71xx (see ../demo/PORTS.md). Run: docker compose up -d --build
name: flora-root

services:
  root-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: flora_root
      POSTGRES_USER: flora_root
      POSTGRES_PASSWORD: ${FLORA_ROOT_DB_PASSWORD:-flora-root-local-only}
    ports:
      - "127.0.0.1:${FLORA_ROOT_DB_PORT:-7102}:5432"
    volumes:
      - root_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flora_root -d flora_root"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  root-api:
    build:
      context: ./api
    image: flora-root-api:dev
    environment:
      FLORA_ROOT_DATABASE_URL: postgresql://flora_root:${FLORA_ROOT_DB_PASSWORD:-flora-root-local-only}@root-db:5432/flora_root
      # Empty = admin API open (demo only). Set a long random value anywhere else.
      ROOT_ADMIN_KEY: ${ROOT_ADMIN_KEY:-}
      ROOT_ADMIN_USERNAME: ${ROOT_ADMIN_USERNAME:-admin}
      ROOT_ADMIN_PASSWORD: ${ROOT_ADMIN_PASSWORD:-admin}
      ROOT_SEED_DEMO: ${ROOT_SEED_DEMO:-true}
      ROOT_DEMO_TENANT_ID: ${ROOT_DEMO_TENANT_ID:-hospital-01}
      ROOT_DEMO_TENANT_KEY: ${ROOT_DEMO_TENANT_KEY:-root-tenant-demo-key}
      # Registry address handed to every Haber in the signed release manifest.
      ROOT_REGISTRY_URL: ${ROOT_REGISTRY_URL:-http://host.docker.internal:7105}
    ports:
      # Published on all interfaces: every Canopy calls Root here.
      - "${FLORA_ROOT_PORT:-7100}:8000"
    depends_on:
      root-db: {condition: service_healthy}
    restart: unless-stopped

  # Every Flora image is built by Root CI and pushed here; Haber mirrors from it.
  # Production: TLS + token auth in front of it (pull-only credentials per tenant).
  root-registry:
    image: registry:3
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      OTEL_TRACES_EXPORTER: none
    ports:
      - "${FLORA_ROOT_REGISTRY_PORT:-7105}:5000"
    volumes:
      - root_registry_data:/var/lib/registry
    restart: unless-stopped

volumes:
  root_db_data:
  root_registry_data:
