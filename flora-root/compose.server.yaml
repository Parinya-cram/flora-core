# Flora Root for the shared server (Portainer GitOps).
#
# Same control plane as compose.yaml (tenants, licenses, release registry) but
# without the nginx `edge` TLS proxy: edge needs certs generated by
# edge/make-dev-cert.sh (not in the repo) and would bind host 443/80, which the
# NAS already uses. root-api is reached directly on 7100 instead. Add the edge
# back later behind the NAS reverse proxy if the Root<->Haber TLS chain is needed.
name: flora-root

services:
  root-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: flora_root
      POSTGRES_USER: flora_root
      POSTGRES_PASSWORD: ${FLORA_ROOT_DB_PASSWORD:-admin}
    ports:
      - "${FLORA_BIND_ADDR:-127.0.0.1}:${FLORA_ROOT_DB_PORT:-7102}:5432"
    volumes:
      - root_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U flora_root -d flora_root"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  root-api:
    build:
      context: ./api
    environment:
      FLORA_ROOT_DATABASE_URL: postgresql://flora_root:${FLORA_ROOT_DB_PASSWORD:-admin}@root-db:5432/flora_root
      ROOT_ADMIN_KEY: ${ROOT_ADMIN_KEY:-}
      ROOT_ADMIN_USERNAME: ${ROOT_ADMIN_USERNAME:-admin}
      ROOT_ADMIN_PASSWORD: ${ROOT_ADMIN_PASSWORD:-admin}
      ROOT_SEED_DEMO: ${ROOT_SEED_DEMO:-true}
      ROOT_DEMO_TENANT_ID: ${ROOT_DEMO_TENANT_ID:-hospital-01}
      ROOT_DEMO_TENANT_KEY: ${ROOT_DEMO_TENANT_KEY:-root-tenant-demo-key}
      ROOT_REGISTRY_URL: ${ROOT_REGISTRY_URL:-http://root-registry:5000}
    ports:
      - "${FLORA_BIND_ADDR:-127.0.0.1}:${FLORA_ROOT_PORT:-7100}:8000"
    depends_on:
      root-db:
        condition: service_healthy
    restart: unless-stopped

  root-registry:
    image: registry:3
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      OTEL_TRACES_EXPORTER: none
    ports:
      - "${FLORA_BIND_ADDR:-127.0.0.1}:${FLORA_ROOT_REGISTRY_PORT:-7105}:5000"
    volumes:
      - root_registry_data:/var/lib/registry
    restart: unless-stopped

volumes:
  root_db_data:
  root_registry_data:
