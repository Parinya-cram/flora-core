# Flora iCIS hospital site: Canopy + appliance (Haber) on the hospital's own cluster, written by site.sh.
# __P__ = namespace prefix (flora), images pinned by digest from the Root release, secrets in the
# k8s Secret "site" of each namespace (generated on this server, never sent to Root).
# Ports on this server: Canopy HTTPS __CANOPY_PORT__, appliance __HABER_PORT__, appliance registry __REGISTRY_PORT__.
apiVersion: v1
kind: Namespace
metadata: { name: __P__-canopy, labels: { flora/site: __TENANT__, flora/tier: canopy } }
---
apiVersion: v1
kind: Namespace
metadata: { name: __P__-appliance, labels: { flora/site: __TENANT__, flora/tier: appliance } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: canopy-db-data, namespace: __P__-canopy }
spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 10Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: canopy-db, namespace: __P__-canopy }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: canopy-db } }
  template:
    metadata: { labels: { app: canopy-db } }
    spec:
      containers:
        - name: canopy-db
          image: __IMG_DB__
          imagePullPolicy: Never
          env:
            - { name: POSTGRES_DB, value: flora }
            - { name: POSTGRES_USER, value: flora_admin }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: site, key: db-admin } } }
            - { name: FLORA_DB_APP_PASSWORD, valueFrom: { secretKeyRef: { name: site, key: db-app } } }
            - { name: FLORA_DB_VIEW_PASSWORD, valueFrom: { secretKeyRef: { name: site, key: db-view } } }
            - { name: FLORA_DB_SYNC_PASSWORD, valueFrom: { secretKeyRef: { name: site, key: db-sync } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [ { containerPort: 5432 } ]
          volumeMounts: [ { name: data, mountPath: /var/lib/postgresql/data } ]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "flora_admin", "-d", "flora"] }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
      volumes: [ { name: data, persistentVolumeClaim: { claimName: canopy-db-data } } ]
---
apiVersion: v1
kind: Service
metadata: { name: canopy-db, namespace: __P__-canopy }
spec: { selector: { app: canopy-db }, ports: [ { port: 5432 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: canopy-api, namespace: __P__-canopy }
spec:
  replicas: 1
  selector: { matchLabels: { app: canopy-api } }
  template:
    metadata: { labels: { app: canopy-api } }
    spec:
      initContainers:
        - { name: wait-for-db, image: __IMG_DB__, imagePullPolicy: Never,
            command: ["sh", "-c", "until pg_isready -h canopy-db -p 5432; do sleep 2; done"] }
      containers:
        - name: canopy-api
          image: __IMG_API__
          imagePullPolicy: Never
          command: ["sh", "-c", "export FLORA_DATABASE_URL=postgresql://flora_view:$DB_VIEW@canopy-db:5432/flora; exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
          env:
            - { name: DB_VIEW, valueFrom: { secretKeyRef: { name: site, key: db-view } } }
            - { name: FLORA_API_ENV, value: production }
            - { name: FLORA_API_MODE, value: canopy }
            - { name: FLORA_CANOPY_SESSION_SECRET, valueFrom: { secretKeyRef: { name: site, key: session } } }
            - { name: FLORA_BOOTSTRAP_ADMIN_ENABLED, value: "true" }
            - { name: FLORA_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: FLORA_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: site, key: admin } } }
            - { name: FLORA_BOOTSTRAP_ADMIN_MUST_CHANGE_PASSWORD, value: "true" }
            - { name: FLORA_BOOTSTRAP_ADMIN_NAME, value: Administrator }
            - { name: FLORA_HABER_URL, value: "http://haber.__P__-appliance.svc.cluster.local:8000" }
            - { name: HABER_ADMIN_USERNAME, value: admin }
            - { name: HABER_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: site, key: haber-admin } } }
          ports: [ { containerPort: 8000 } ]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 60 }
---
apiVersion: v1
kind: Service
metadata: { name: canopy-api, namespace: __P__-canopy }
spec: { selector: { app: canopy-api }, ports: [ { port: 8000 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: sync-api, namespace: __P__-canopy }
spec:
  replicas: 1
  selector: { matchLabels: { app: sync-api } }
  template:
    metadata: { labels: { app: sync-api } }
    spec:
      initContainers:
        - { name: wait-for-db, image: __IMG_DB__, imagePullPolicy: Never,
            command: ["sh", "-c", "until pg_isready -h canopy-db -p 5432; do sleep 2; done"] }
      containers:
        - name: sync-api
          image: __IMG_API__
          imagePullPolicy: Never
          command: ["sh", "-c", "export FLORA_DATABASE_URL=postgresql://flora_sync:$DB_SYNC@canopy-db:5432/flora; exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
          env:
            - { name: DB_SYNC, valueFrom: { secretKeyRef: { name: site, key: db-sync } } }
            - { name: FLORA_API_ENV, value: production }
            - { name: FLORA_API_MODE, value: sync }
            - { name: FLORA_SYNC_SHARED_SECRET, valueFrom: { secretKeyRef: { name: site, key: sync } } }
          ports: [ { containerPort: 8000 } ]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 60 }
---
apiVersion: v1
kind: Service
metadata: { name: sync-api, namespace: __P__-canopy }
spec: { selector: { app: sync-api }, ports: [ { port: 8000 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: canopy-web, namespace: __P__-canopy }
spec:
  replicas: 1
  selector: { matchLabels: { app: canopy-web } }
  template:
    metadata: { labels: { app: canopy-web } }
    spec:
      containers:
        - name: canopy-web
          image: __IMG_WEB__
          imagePullPolicy: Never
          env: [ { name: API_UPSTREAM, value: "http://canopy-api:8000" } ]
          ports: [ { containerPort: 80 } ]
---
apiVersion: v1
kind: Service
metadata: { name: canopy-web, namespace: __P__-canopy }
spec: { selector: { app: canopy-web }, ports: [ { port: 80 } ] }
---
# HTTPS entry of this hospital: the Canopy app, and /api/sync/ for Leafs on the LAN.
apiVersion: v1
kind: ConfigMap
metadata: { name: edge-nginx, namespace: __P__-canopy }
data:
  default.conf: |
    server {
      listen 443 ssl;
      http2 on;
      server_name _;
      ssl_certificate /etc/edge-tls/tls.crt;
      ssl_certificate_key /etc/edge-tls/tls.key;
      client_max_body_size 50m;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      location /api/sync/ { proxy_pass http://sync-api.__P__-canopy.svc.cluster.local:8000; proxy_read_timeout 120s; }
      location / { proxy_pass http://canopy-web.__P__-canopy.svc.cluster.local:80; proxy_read_timeout 300s; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: edge, namespace: __P__-canopy }
spec:
  replicas: 1
  strategy: { type: Recreate }      # one pod owns the host port: stop the old one before the new starts
  selector: { matchLabels: { app: edge } }
  template:
    metadata: { labels: { app: edge } }
    spec:
      containers:
        - name: edge
          image: __IMG_WEB__        # the Canopy web image is nginx too; its own config is replaced by edge-nginx below
          imagePullPolicy: Never
          env:
            - { name: NGINX_ENVSUBST_OUTPUT_DIR, value: /tmp }   # the image's own template must not write into conf.d
          ports: [ { containerPort: 443, hostPort: __CANOPY_PORT__ } ]
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d }
            - { name: tls, mountPath: /etc/edge-tls, readOnly: true }
      volumes:
        - { name: conf, configMap: { name: edge-nginx } }
        - { name: tls, secret: { secretName: edge-tls } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: haber-registry-data, namespace: __P__-appliance }
spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 50Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: haber-registry, namespace: __P__-appliance }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: haber-registry } }
  template:
    metadata: { labels: { app: haber-registry } }
    spec:
      containers:
        - name: registry
          image: __IMG_REGISTRY__
          imagePullPolicy: Never
          env:
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
            - { name: OTEL_TRACES_EXPORTER, value: none }
          ports: [ { containerPort: 5000, hostPort: __REGISTRY_PORT__ } ]
          volumeMounts: [ { name: data, mountPath: /var/lib/registry } ]
      volumes: [ { name: data, persistentVolumeClaim: { claimName: haber-registry-data } } ]
---
apiVersion: v1
kind: Service
metadata: { name: haber-registry, namespace: __P__-appliance }
spec: { selector: { app: haber-registry }, ports: [ { port: 5000 } ] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: haber-data, namespace: __P__-appliance }
spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 1Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: haber, namespace: __P__-appliance }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: haber } }
  template:
    metadata: { labels: { app: haber } }
    spec:
      containers:
        - name: haber
          image: __IMG_HABER__
          imagePullPolicy: Never
          env:
            - { name: FLORA_TENANT_ID, value: "__TENANT__" }
            - { name: FLORA_ROOT_URL, value: "__ROOT_API__" }
            - { name: FLORA_ROOT_TENANT_KEY, valueFrom: { secretKeyRef: { name: site, key: tenant-key } } }
            - { name: FLORA_ROOT_PUBLIC_KEY, value: "__ROOT_PUBLIC_KEY__" }
            - { name: FLORA_ROOT_REGISTRY_URL, value: "__ROOT_REGISTRY__" }
            - { name: HABER_GATEWAY_TOKEN, valueFrom: { secretKeyRef: { name: site, key: gateway-token } } }
            - { name: HABER_NODE_TOKEN, valueFrom: { secretKeyRef: { name: site, key: node-token } } }
            - { name: HABER_ADMIN_USERNAME, value: admin }
            - { name: HABER_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: site, key: haber-admin } } }
            - { name: FLORA_CANOPY_SYNC_URL, value: "http://sync-api.__P__-canopy.svc.cluster.local:8000" }
            - { name: FLORA_CANOPY_SYNC_PUBLIC_URL, value: "https://__IP__:__CANOPY_PORT__" }
            - { name: FLORA_APPLIANCE_PUBLIC_URL, value: "http://__IP__:__HABER_PORT__" }
            - { name: FLORA_SYNC_SHARED_SECRET, valueFrom: { secretKeyRef: { name: site, key: sync } } }
            - { name: HABER_REGISTRY_URL, value: "http://haber-registry:5000" }
            - { name: HABER_REGISTRY_PUBLIC, value: "__IP__:__REGISTRY_PORT__" }
            - { name: HABER_ROOT_SYNC_SEC, value: "20" }
            - { name: HABER_DB_PATH, value: /data/haber.db }
            - { name: SSL_CERT_FILE, value: /etc/flora/trust/trust.pem }   # system CAs + Root's certificate
          ports: [ { containerPort: 8000, hostPort: __HABER_PORT__ } ]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: trust, mountPath: /etc/flora/trust, readOnly: true }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: haber-data } }
        - { name: trust, configMap: { name: root-trust } }
---
apiVersion: v1
kind: Service
metadata: { name: haber, namespace: __P__-appliance }
spec: { selector: { app: haber }, ports: [ { port: 8000 } ] }
