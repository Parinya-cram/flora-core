# Flora Root edge: the only port Canopies (Haber) need, 443 in production.
#
#   /v2/  → root-registry   Haber mirrors approved release images
#   /     → root-api        keys, license bundles, releases, heartbeats, admin UI

# Resolve upstreams per request so the edge starts even if one service is down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/root.crt;
    ssl_certificate_key /etc/nginx/certs/root.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_connect_timeout 5s;

    set $root_api      root-api:8000;
    set $root_registry root-registry:5000;

    location /v2/ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_pass http://$root_registry;
    }

    location / { proxy_pass http://$root_api; }
}
