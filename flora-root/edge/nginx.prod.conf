# Flora Root edge for root.floraicis.prod.yml: plain HTTP on 7100 (host side).
# TLS, if any, is terminated by a proxy in front of it.
#
#   /v2/  → root-registry   Haber mirrors approved release images
#   /     → root-api        keys, license bundles, releases, heartbeats, admin UI

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;
    proxy_http_version 1.1;
    # $http_host keeps the published port, so registry Location headers stay reachable.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
    proxy_connect_timeout 5s;

    set $root_api      root-api:8000;
    set $root_registry root-registry:5000;

    location /v2/ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_pass http://$root_registry;
    }

    location / { proxy_pass http://$root_api; }
}
