spec:
  selector: {app: gateway-db}
  ports: [{port: 7412, protocol: TCP}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: gateway-db-data, namespace: gateway-233}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
