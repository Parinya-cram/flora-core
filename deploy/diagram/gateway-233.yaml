apiVersion: v1
kind: Namespace
metadata:
  name: gateway-233
  labels: {host: 172.22.1.233, runtime: docker-compose, flora/site: kcmh}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: edge, namespace: gateway-233, labels: {app: edge}}
spec:
  replicas: 1
  selector: {matchLabels: {app: edge}}
  template:
    metadata: {labels: {app: edge}}
    spec:
      containers:
      - name: edge
        image: flora-gateway/edge
---
apiVersion: v1
kind: Service
metadata: {name: edge, namespace: gateway-233}
spec:
  selector: {app: edge}
  ports: [{port: 443, protocol: TCP}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway-service, namespace: gateway-233, labels: {app: gateway-service}}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway-service}}
  template:
    metadata: {labels: {app: gateway-service}}
    spec:
      containers:
      - name: gateway-service
        image: flora-gateway/gateway-service
---
apiVersion: v1
kind: Service
metadata: {name: gateway-service, namespace: gateway-233}
spec:
  selector: {app: gateway-service}
  ports: [{port: 7400, protocol: TCP}]
---
apiVersion: apps/v1
