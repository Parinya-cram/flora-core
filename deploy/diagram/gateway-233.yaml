spec:
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      containers:
      - name: kafka
        image: flora-gateway/kafka
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: kafka-data}
---
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: gateway-233}
spec:
  selector: {app: kafka}
  ports: [{port: 7414, protocol: TCP}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: kafka-data, namespace: gateway-233}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
