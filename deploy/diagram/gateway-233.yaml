      - name: data
        persistentVolumeClaim: {claimName: updater-state}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: updater-state, namespace: gateway-233}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
