# Flora Root (vendor console) — on the pilot box as its own namespace (movable mgmt UI).
# edge 8443 -> root-api:8000
apiVersion: v1
kind: Namespace
metadata: { name: flora-root }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: root-db-data, namespace: flora-root }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: root-db, namespace: flora-root }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: root-db } }
  template:
    metadata: { labels: { app: root-db } }
    spec:
      containers:
        - name: root-db
          image: postgres:17.6-alpine
          imagePullPolicy: Never
          env:
            - { name: POSTGRES_DB, value: "flora_root" }
            - { name: POSTGRES_USER, value: "flora_root" }
            - { name: POSTGRES_PASSWORD, value: "admin" }
            - { name: PGDATA, value: "/var/lib/postgresql/data/pgdata" }
          ports: [ { containerPort: 5432 } ]
          volumeMounts: [ { name: data, mountPath: /var/lib/postgresql/data } ]
          readinessProbe:
            exec: { command: ["pg_isready","-U","flora_root","-d","flora_root"] }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: root-db-data } }
---
apiVersion: v1
kind: Service
metadata: { name: root-db, namespace: flora-root }
spec:
  selector: { app: root-db }
  ports: [ { port: 5432, targetPort: 5432 } ]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: root-registry-data, namespace: flora-root }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: root-registry, namespace: flora-root }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: root-registry } }
  template:
    metadata: { labels: { app: root-registry } }
    spec:
      containers:
        - name: registry
          image: registry:3
          imagePullPolicy: Never
          env:
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
            - { name: OTEL_TRACES_EXPORTER, value: "none" }
          ports: [ { containerPort: 5000, hostPort: 7105 } ]   # Root registry standard port
          volumeMounts: [ { name: data, mountPath: /var/lib/registry } ]
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: root-registry-data } }
---
apiVersion: v1
kind: Service
metadata: { name: root-registry, namespace: flora-root }
spec:
  selector: { app: root-registry }
  ports: [ { port: 5000, targetPort: 5000 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: root-api, namespace: flora-root }
spec:
  replicas: 1
  selector: { matchLabels: { app: root-api } }
  template:
    metadata: { labels: { app: root-api } }
    spec:
      containers:
        - name: root-api
          image: flora-root-root-api:latest
          imagePullPolicy: Never
          env:
            - { name: FLORA_ROOT_DATABASE_URL, value: "postgresql://flora_root:admin@root-db:5432/flora_root" }
            - { name: ROOT_ADMIN_USERNAME, value: "admin" }
            - { name: ROOT_ADMIN_PASSWORD, value: "admin" }
            - { name: ROOT_SEED_DEMO, value: "true" }
            - { name: ROOT_DEMO_TENANT_ID, value: "hospital-01" }
            - { name: ROOT_DEMO_TENANT_KEY, value: "root-tenant-demo-key" }
            - { name: ROOT_REGISTRY_URL, value: "http://172.22.19.81:7105" }   # as hospital servers reach it (site installs pull here)
            - { name: ROOT_PUBLIC_URL, value: "https://172.22.19.81:8443" }    # Root as hospitals reach it (handed out at site install)
          ports: [ { containerPort: 8000 } ]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata: { name: root-api, namespace: flora-root }
spec:
  selector: { app: root-api }
  ports: [ { port: 8000, targetPort: 8000 } ]
