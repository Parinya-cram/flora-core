# Container logs are capped (Docker's default json-file log grows without limit and has filled servers): at most
# FLORA_LOG_MAX_FILES files of FLORA_LOG_MAX_SIZE each per container, the oldest dropped first.
x-flora-logging: &flora-logging
  driver: json-file
  options:
    max-size: "${FLORA_LOG_MAX_SIZE:-10m}"
    max-file: "${FLORA_LOG_MAX_FILES:-3}"

services:
  flora-leaf-api:
    logging: *flora-logging
    build:
      context: ../services/flora-api
    environment:
      FLORA_DATABASE_URL: postgresql://flora_app:${FLORA_DB_APP_PASSWORD:-flora-app-local-only}@postgres:5432/${FLORA_POSTGRES_DB:-flora}
      FLORA_API_ENV: development
      FLORA_API_MODE: leaf
      FLORA_LEAF_WRITE_API: "true"
      FLORA_BOOTSTRAP_ADMIN_ENABLED: ${FLORA_BOOTSTRAP_ADMIN_ENABLED:-true}
      FLORA_BOOTSTRAP_ADMIN_USERNAME: ${FLORA_BOOTSTRAP_ADMIN_USERNAME:-admin}
      FLORA_BOOTSTRAP_ADMIN_PASSWORD: ${FLORA_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      FLORA_BOOTSTRAP_ADMIN_NAME: ${FLORA_BOOTSTRAP_ADMIN_NAME:-Administrator}
      FLORA_DEVICE_INGEST_ENABLED: "true"
      FLORA_LEAF_SERVICE_SECRET: ${FLORA_LEAF_SERVICE_SECRET:-flora-leaf-service-dev-secret-change-me}
      FLORA_CANOPY_SYNC_URL: ${FLORA_CANOPY_SYNC_URL:-http://flora-sync-api:8000}
      FLORA_SYNC_SHARED_SECRET: ${FLORA_SYNC_SHARED_SECRET:-flora-sync-dev-secret-change-me}
      FLORA_ACCOUNT_CONFIG_SYNC_TIMEOUT_SECONDS: ${FLORA_ACCOUNT_CONFIG_SYNC_TIMEOUT_SECONDS:-1.5}
      FLORA_LEAF_ID: ${FLORA_LEAF_ID:-leaf-dev-01}
      VECTOR_READ_URL: ${VECTOR_READ_URL:-http://flora-liveagent:8000/api/observations}
      HIS_GATEWAY_BASE_URL: ${HIS_GATEWAY_BASE_URL:-http://10.35.202.6:8590}
      FLORA_HIS_DEMO_MODE: ${FLORA_HIS_DEMO_MODE:-false}
    ports:
      - "${FLORA_BIND_ADDR:-127.0.0.1}:${FLORA_LEAF_API_PORT:-6893}:8000"
    volumes:
      - ../services/flora-api/app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      flora-liveagent:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
