# Container logs are capped (Docker's default json-file log grows without limit and has filled servers): at most
# FLORA_LOG_MAX_FILES files of FLORA_LOG_MAX_SIZE each per container, the oldest dropped first.
x-flora-logging: &flora-logging
  driver: json-file
  options:
    max-size: "${FLORA_LOG_MAX_SIZE:-10m}"
    max-file: "${FLORA_LOG_MAX_FILES:-3}"

services:
  flora-canopy-api:
    logging: *flora-logging
    build:
      context: ../services/flora-api
    profiles: ["canopy"]
    environment:
      FLORA_DATABASE_URL: postgresql://flora_view:${FLORA_DB_VIEW_PASSWORD:-flora-view-local-only}@postgres:5432/${FLORA_POSTGRES_DB:-flora}
      FLORA_API_ENV: development
      FLORA_API_MODE: canopy
      FLORA_CANOPY_SESSION_SECRET: ${FLORA_CANOPY_SESSION_SECRET:-flora-canopy-dev-secret-change-me}
      FLORA_BOOTSTRAP_ADMIN_ENABLED: ${FLORA_BOOTSTRAP_ADMIN_ENABLED:-true}
      FLORA_BOOTSTRAP_ADMIN_USERNAME: ${FLORA_BOOTSTRAP_ADMIN_USERNAME:-admin}
      FLORA_BOOTSTRAP_ADMIN_PASSWORD: ${FLORA_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      FLORA_BOOTSTRAP_ADMIN_NAME: ${FLORA_BOOTSTRAP_ADMIN_NAME:-Administrator}
      FORMDEV_JOB_DIR: /var/lib/flora/formdev-jobs
    ports:
      - "${FLORA_BIND_ADDR:-127.0.0.1}:${FLORA_CANOPY_API_PORT:-6895}:8000"
    volumes:
      - ../services/flora-api/app:/app/app:ro
      - flora_formdev_jobs:/var/lib/flora/formdev-jobs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  flora-canopy:
    logging: *flora-logging
    build:
      context: ..
      dockerfile: Dockerfile.frontend.dev
    profiles: ["canopy"]
    ports:
      - "${FLORA_CANOPY_PORT:-6894}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_FLORA_SURFACE: canopy
      VITE_API_PROXY_TARGET: http://flora-canopy-api:8000
    volumes:
      - ../frontend:/app/frontend:ro
      - flora_canopy_frontend_modules:/app/frontend/node_modules
    command: ["sh", "-c", "npm ci --ignore-scripts --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    depends_on:
      flora-canopy-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  flora_canopy_frontend_modules:
  flora_formdev_jobs:
