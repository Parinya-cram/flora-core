# Container logs are capped (Docker's default json-file log grows without limit and has filled servers): at most
# FLORA_LOG_MAX_FILES files of FLORA_LOG_MAX_SIZE each per container, the oldest dropped first.
x-flora-logging: &flora-logging
  driver: json-file
  options:
    max-size: "${FLORA_LOG_MAX_SIZE:-10m}"
    max-file: "${FLORA_LOG_MAX_FILES:-3}"

services:
  flora-leaf:
    logging: *flora-logging
    build:
      context: ..
      dockerfile: Dockerfile.frontend.dev
    ports:
      - "${FLORA_LEAF_PORT:-6890}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_FLORA_SURFACE: leaf
      VITE_API_PROXY_TARGET: http://flora-leaf-api:8000
    volumes:
      - ../frontend:/app/frontend
      - flora_frontend_modules:/app/frontend/node_modules
    command: ["sh", "-c", "npm ci --ignore-scripts --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    depends_on:
      flora-leaf-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  flora_frontend_modules:
