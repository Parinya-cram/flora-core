# Container logs are capped (Docker's default json-file log grows without limit and has filled servers): at most
# FLORA_LOG_MAX_FILES files of FLORA_LOG_MAX_SIZE each per container, the oldest dropped first.
x-flora-logging: &flora-logging
  driver: json-file
  options:
    max-size: "${FLORA_LOG_MAX_SIZE:-10m}"
    max-file: "${FLORA_LOG_MAX_FILES:-3}"

services:
  flora-liveagent:
    logging: *flora-logging
    build:
      context: ../services/flora-liveagent
    environment:
      LIVEAGENT_PROFILE: ${LIVEAGENT_PROFILE:-stable-anes}
      LIVEAGENT_SEED: ${LIVEAGENT_SEED:-17}
      LIVEAGENT_MAX_WINDOW_MINUTES: ${LIVEAGENT_MAX_WINDOW_MINUTES:-240}
      LIVEAGENT_PUMP_START_MS: ${LIVEAGENT_PUMP_START_MS:-}
    ports:
      - "${FLORA_BIND_ADDR:-127.0.0.1}:${FLORA_LIVEAGENT_PORT:-6897}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
