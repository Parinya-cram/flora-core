services:
  postgres:
    image: postgres:17.6-alpine
    # Parallel query (FormDev report and export jobs) needs shared memory; Docker's default /dev/shm is 64 MB.
    shm_size: 1gb
    environment:
      POSTGRES_DB: ${FLORA_POSTGRES_DB:-flora}
      POSTGRES_USER: ${FLORA_POSTGRES_ADMIN_USER:-flora_admin}
      POSTGRES_PASSWORD: ${FLORA_POSTGRES_ADMIN_PASSWORD:-flora-admin-local-only}
      FLORA_DB_APP_PASSWORD: ${FLORA_DB_APP_PASSWORD:-flora-app-local-only}
      FLORA_DB_VIEW_PASSWORD: ${FLORA_DB_VIEW_PASSWORD:-flora-view-local-only}
      FLORA_DB_SYNC_PASSWORD: ${FLORA_DB_SYNC_PASSWORD:-flora-sync-local-only}
    ports:
      - "${FLORA_BIND_ADDR:-127.0.0.1}:${FLORA_POSTGRES_PORT:-6892}:5432"
    volumes:
      - flora_postgres_data:/var/lib/postgresql/data
      - ../infrastructure/postgres/0000-create-app-role.sql:/docker-entrypoint-initdb.d/0000-create-app-role.sql:ro
      - ../docs/database/flora-schema.sql:/docker-entrypoint-initdb.d/0001-schema.sql:ro
      - ../infrastructure/postgres/0001-post-import-indexes.sql:/docker-entrypoint-initdb.d/0002-post-import-indexes.sql:ro
      - ../infrastructure/postgres/0003-create-view-role.sql:/docker-entrypoint-initdb.d/0003-create-view-role.sql:ro
      - ../infrastructure/postgres/0004-leaf-canopy-sync.sql:/docker-entrypoint-initdb.d/0004-leaf-canopy-sync.sql:ro
      - ../infrastructure/postgres/0005-leaf-writes.sql:/docker-entrypoint-initdb.d/0005-leaf-writes.sql:ro
      - ../infrastructure/postgres/0007-preference-masters.sql:/docker-entrypoint-initdb.d/0007-preference-masters.sql:ro
      - ../infrastructure/postgres/0008-case-admission.sql:/docker-entrypoint-initdb.d/0008-case-admission.sql:ro
      - ../infrastructure/postgres/0009-workstation-context.sql:/docker-entrypoint-initdb.d/0009-workstation-context.sql:ro
      - ../infrastructure/postgres/0010-language-translations.sql:/docker-entrypoint-initdb.d/0010-language-translations.sql:ro
      - ../infrastructure/postgres/0011-datetime-preferences.sql:/docker-entrypoint-initdb.d/0011-datetime-preferences.sql:ro
